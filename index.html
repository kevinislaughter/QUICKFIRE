const h = (s) => esc(s == null ? "" : s);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function setUI(mode){
  S.ui = mode;
  try{ localStorage.setItem(UI_PREF, mode); }catch(e){}
  document.documentElement.classList.toggle("q2", mode === "q2");
  if(mode === "q2"){ S.booting = false; M.render(); }
  else { $("q2").innerHTML = ""; fit(); goMenu(); focusIn(); }
}
function savedUI(){ try{ return localStorage.getItem(UI_PREF) || "classic"; }catch(e){ return "classic"; } }

/* ---------- small building blocks ---------- */
M.toast = (msg, kind) => {
  const box = $("q2").querySelector(".q2-toasts"); if(!box) return;
  const t = document.createElement("div");
  t.className = "q2-toast" + (kind === "error" ? " error" : "");
  t.setAttribute("role", kind === "error" ? "alert" : "status");
  t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.remove(), kind === "error" ? 9000 : 4500);
};
M.dialog = (html, opts = {}) => new Promise(resolve => {
  const d = document.createElement("dialog");
  if(opts.wide) d.className = "wide";
  d.innerHTML = `<form method="dialog" class="q2-dlg">${html}</form>`;
  $("q2").appendChild(d);
  d.addEventListener("close", () => { const v = d.returnValue; const fd = new FormData(d.querySelector("form")); d.remove(); resolve({ value:v, data:fd }); });
  if(opts.onOpen) opts.onOpen(d);
  d.showModal();
});
M.confirm = async (title, body, okLabel, danger) => {
  const r = await M.dialog(`<h2>${h(title)}</h2><p>${h(body)}</p>
    <div class="acts"><button class="q2-btn" value="cancel">Cancel</button>
    <button class="q2-btn ${danger ? "danger" : "primary"}" value="ok">${h(okLabel)}</button></div>`);
  return r.value === "ok";
};
const fmtShort = iso => iso ? fmtDate(iso) : "";
const cap = v => v ? v.charAt(0) + v.slice(1).toLowerCase() : "";
const NFA_LABEL = { "SUPPRESSOR":"Suppressor", "SBR":"SBR", "SBS":"SBS", "AOW":"AOW", "MACHINE GUN":"Machine gun", "DESTRUCTIVE DEVICE":"Destructive device" };
const typeLabel = r => isNFA(r) ? (NFA_LABEL[r.nfa_item] || "NFA item") : (r.type === "OTHER" ? (r.type_other || "Other") : (r.type ? r.type.charAt(0) + r.type.slice(1).toLowerCase() : ""));
const titleOf = r => [r.make, r.model].filter(Boolean).join(" ") || typeLabel(r) || "Untitled entry";

/* ---------- whole-page render ---------- */
M.fileHTML = () => {

};

};

/* ---------- list + detail ---------- */
M.list = () => {
  let list = S.records.slice();
  if(M.filter === "HELD") list = list.filter(r => !isDisposed(r));
  if(M.filter === "DISPOSED") list = list.filter(isDisposed);
  if(M.filter === "NFA") list = list.filter(isNFA);
  if(M.q){
    const q = M.q.toLowerCase();
    list = list.filter(r => CSV_COLS.some(c => c !== "repairs" && String(r[c] || "").toLowerCase().includes(q))
      || r.repairs.some(x => [x.desc, x.date, fmtDate(x.date), x.cost].some(v => String(v || "").toLowerCase().includes(q))));
  }
  const k = M.sort.key, dir = M.sort.dir;
  const val = r => k === "type" ? typeLabel(r) : k === "status" ? (isDisposed(r) ? "Disposed" : "Held") : (r[k] || "");
  list.sort((a,b) => {
    const A = val(a), B = val(b);
    if(!A && B) return 1; if(A && !B) return -1;
    return dir * String(A).localeCompare(String(B), undefined, { numeric:true, sensitivity:"base" });
  });
  return list;
};
M.listHTML = (st, nfa) => {
  if(!S.records.length) return `<main class="q2-main"><div class="q2-empty">
      <h2>${S.fileName ? "This ledger is empty" : "No ledger open"}</h2>
      <p>Open an existing ledger file, or start with your first entry.</p>
      <button class="q2-btn primary" data-act="new">New entry</button> <button class="q2-btn" data-act="open">Open a ledger</button>
      <p style="margin-top:14px">You can also drop a .csv file anywhere on this page.</p></div></main>`;
  const list = M.list();
  const cols = [["log_no","Log"],["type","Type"],["make","Make"],["model","Model"],["caliber","Caliber"],["serial","Serial"],["acq_date","Acquired"],["status","Status"]];
  const segs = [["ALL","All",st.n],["HELD","Held",st.h],["DISPOSED","Disposed",st.d],["NFA","NFA",nfa]];
  const sel = M.sel && S.records.includes(M.sel) ? M.sel : null;
  return `<main class="q2-main ${sel ? "has-detail" : ""}">
  <section class="q2-list" aria-label="Ledger">
    <div class="q2-tools">
      <input class="q2-search" type="search" placeholder="Search make, serial, notes, names…" value="${h(M.q)}" aria-label="Search the ledger" data-act="search">
      <div class="q2-seg" role="group" aria-label="Show">${segs.map(([k,l,n]) => `<button data-filter="${k}" aria-pressed="${M.filter === k}">${l} <span class="num">${n}</span></button>`).join("")}</div>
      <span class="q2-count num">${list.length === st.n ? plural(st.n, "entry").replace("entrys","entries") : `${list.length} of ${st.n} shown`}</span>
    </div>
    <div class="q2-tablewrap"><table class="q2-table">
      <thead><tr>${cols.map(([k,l]) => `<th ${M.sort.key === k ? `aria-sort="${M.sort.dir > 0 ? "ascending" : "descending"}"` : ""}><button data-sort="${k}">${l}${M.sort.key === k ? (M.sort.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${list.map(r => `<tr data-idx="${S.records.indexOf(r)}" tabindex="0" aria-selected="${r === sel}" class="${isDisposed(r) ? "gone" : ""}">
        <td class="num">${h(r.log_no)}</td>
        <td>${isNFA(r) ? `<span class="q2-tag nfa">${h(typeLabel(r))}</span>` : h(typeLabel(r))}</td>
        <td>${h(r.make)}</td><td>${h(r.model)}</td><td>${h(r.caliber)}</td><td class="ser">${h(r.serial)}</td>
        <td class="num">${h(fmtShort(r.acq_date))}</td>

    ${!list.length ? `<p style="color:var(--muted)">Nothing matches. <button class="q2-btn plain" data-act="clearsearch">Clear the search and filter</button></p>` : ""}
  </section>
  ${sel ? M.cardHTML(sel) : ""}
  </main>`;
};
const dl = (label, value, wide) => `<div class="${wide ? "wide" : ""}"><dt>${h(label)}</dt><dd>${h(value)}</dd></div>`;
M.cardHTML = r => {

    <div class="q2-card-head"><button class="q2-btn plain q2-close" data-act="close">Close</button><div class="log">Log ${h(r.log_no || "—")}${gone ? " · disposed" : ""}</div>
      <h2>${h(titleOf(r))}</h2>

      ${dl("From", r.acq_name, true)}${dl("FFL # or address", r.acq_address, true)}</dl></section>
    <section class="q2-sec"><h3>Repairs and modifications</h3>
      ${r.repairs.length ? `<table class="q2-reps"><tbody>${r.repairs.map(x => `<tr><td class="num">${h(fmtShort(x.date))}</td><td>${h(x.desc)}</td><td class="num">${h(fmtMoney(x.cost))}</td></tr>`).join("")}</tbody></table>` : `<p style="color:var(--muted);margin:0 0 10px">None recorded.</p>`}</section>
    ${gone ? `<section class="q2-sec"><h3>Disposed</h3><dl class="q2-grid">
      ${dl("Date", fmtShort(r.disp_date))}${dl("How", r.disp_source === "OTHER" ? r.disp_source_other || "Other" : cap(r.disp_source))}${dl("Price", fmtMoney(r.disp_price))}${dl("Phone", r.disp_phone)}
      ${dl("To", r.disp_name, true)}${dl("ID #", r.disp_id)}${dl("Date of birth", fmtShort(r.disp_dob))}
      ${dl("Other", r.disp_other, true)}${dl("Address", r.disp_address, true)}</dl></section>` : ""}
  </aside>`;
};

/* ---------- editor ---------- */
const sel = (list, labels) => list.map((v,i) => [v, labels ? labels[i] : v.charAt(0) + v.slice(1).toLowerCase()]);
const EF = [
  { sec:"Description" },
  { k:"log_no", l:"Log number", req:true },
  { k:"type", l:"Type", opts:sel(CH_TYPE, ["Rifle","Shotgun","Handgun","NFA item","Other"]) },
  { k:"nfa_item", l:"NFA item", opts:sel(CH_NFA_ITEM, ["Suppressor","Short-barreled rifle (SBR)","Short-barreled shotgun (SBS)","Any other weapon (AOW)","Machine gun","Destructive device"]), show:isNFA },

  { k:"nfa_form", l:"ATF form", opts:sel(CH_NFA_FORM, ["Form 4 (transfer)","Form 1 (make)","Form 5 (tax-exempt)","Other"]) },

  { k:"nfa_registrant", l:"Registrant name" },
  { k:"nfa_status", l:"Status", opts:sel(CH_NFA_STATUS) },
  { k:"nfa_submitted", l:"Submitted", date:true },
  { k:"nfa_approved", l:"Approved", date:true, show:r => r.nfa_status !== "PENDING" },
  { k:"nfa_stamp", l:"Tax stamp serial", show:r => r.nfa_status !== "PENDING" },
  { k:"nfa_oal", l:"Overall length", show:hasOAL },
  { sec:"Received" },
  { k:"acq_source", l:"How", opts:sel(CH_SRC, ["Store","Gun show","Private party","Other"]) },
  { k:"acq_source_other", l:"Other how", show:r => r.acq_source === "OTHER" },
  { k:"acq_date", l:"Date", date:true },

M.startEdit = (rec, isNew, opts = {}) => {
  const r = clone(rec);

  M.editing = { orig: isNew ? null : rec, rec: r, isNew, gone: opts.gone ?? isDisposed(rec), focus: opts.focus };
  M.view = "edit"; M.render(); window.scrollTo(0,0);
};
M.editorHTML = () => {
  const E = M.editing, r = E.rec;
  let html = "", open = false;
  const close = () => open ? "</div></fieldset>" : "";
  EF.forEach((f, i) => {
    if(f.sec){
      html += close(); open = true;
      html += `<fieldset data-sec="${i}"><legend>${f.sec}</legend>`;
      if(f.disposition) html += `<label class="q2-check"><input type="checkbox" data-gone ${E.gone ? "checked" : ""}> No longer in my possession</label>`;
      html += `<div class="q2-fields">`;
      if(f.repairs) html += `<div class="q2-f wide" id="q2-reps">${r.repairs.map(M.repRow).join("")}<button type="button" class="q2-btn" data-act="addrep">Add a repair or modification</button></div>`;
      return;
    }
    const id = "q2f-" + f.k, label = typeof f.l === "function" ? f.l(r) : f.l;
    let v = r[f.k] || "";
    let input;
    if(f.opts) input = `<select id="${id}" name="${f.k}"><option value=""></option>${f.opts.map(([val,lab]) => `<option value="${val}" ${v === val ? "selected" : ""}>${h(lab)}</option>`).join("")}</select>`;
    else if(f.area) input = `<textarea id="${id}" name="${f.k}">${h(v)}</textarea>`;
    else if(f.date) input = `<input id="${id}" name="${f.k}" type="date" value="${h(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "")}">`;
    else if(f.money) input = `<input id="${id}" name="${f.k}" inputmode="decimal" value="${h(v ? Number(v).toFixed(2) : "")}" placeholder="0.00">`;
    else input = `<input id="${id}" name="${f.k}" value="${h(v)}" ${f.req ? "required" : ""} autocomplete="off">`;
    html += `<div class="q2-f ${f.wide ? "wide" : ""}" data-f="${i}"><label for="${id}">${h(label)}</label>${input}<span class="msg" aria-live="polite"></span></div>`;
  });
  html += close();
  return `<form class="q2-editor" novalidate>
    <header><h2>${E.isNew ? "New entry" : "Edit " + h(titleOf(E.orig))}</h2></header>
    ${html}
    <footer><span class="note">${E.isNew ? "Log numbers follow the year and the order of arrival." : "Changes apply when you save the entry."}</span>
      <button type="button" class="q2-btn" data-act="canceledit">Cancel</button>
      <button type="submit" class="q2-btn primary">${E.isNew ? "Add to ledger" : "Save entry"}</button></footer>
  </form>`;
};
M.repRow = x => `<div class="q2-rep-row"><input type="date" aria-label="Date" value="${h(x.date)}" data-rep="date">

M.readForm = () => {
  const E = M.editing, form = $("q2").querySelector(".q2-editor");
  EF.forEach(f => { if(f.k){ const el = form.elements[f.k]; if(el) E.rec[f.k] = el.value.trim(); } });
  E.gone = !!form.querySelector("[data-gone]").checked;
  E.rec.repairs = [...form.querySelectorAll(".q2-rep-row")].map(row => ({
    date: row.querySelector('[data-rep="date"]').value, desc: row.querySelector('[data-rep="desc"]').value.trim(), cost: row.querySelector('[data-rep="cost"]').value.trim() }));
};
M.applyVisibility = () => {
  const E = M.editing, form = $("q2").querySelector(".q2-editor"); if(!form) return;
  let secShown = true;
  EF.forEach((f, i) => {
    if(f.sec){ const fs = form.querySelector(`[data-sec="${i}"]`); secShown = !f.show || f.show(E.rec, E); fs.hidden = !secShown; return; }
    const box = form.querySelector(`[data-f="${i}"]`);
    box.hidden = !secShown || (f.show && !f.show(E.rec, E));
    if(typeof f.l === "function") box.querySelector("label").textContent = f.l(E.rec);
  });
};
M.wireEditor = () => {
  const form = $("q2").querySelector(".q2-editor");
  M.applyVisibility();
  form.addEventListener("input", () => { M.readForm(); M.applyVisibility(); });
  form.addEventListener("change", () => { M.readForm(); M.applyVisibility(); });
  form.addEventListener("submit", e => { e.preventDefault(); M.commitEdit(); });
  const first = M.editing.focus ? form.querySelector(`[name="${M.editing.focus}"]`) : form.querySelector("input,select");
  if(first) first.focus();
};
M.commitEdit = () => {
  M.readForm();
  const E = M.editing, r = E.rec, form = $("q2").querySelector(".q2-editor");
  form.querySelectorAll(".msg").forEach(m => m.textContent = "");
  form.querySelectorAll(".bad").forEach(m => m.classList.remove("bad"));
  const bad = [];
  const flag = (k, msg) => { const el = form.elements[k]; if(el){ el.classList.add("bad"); el.closest(".q2-f").querySelector(".msg").textContent = msg; } bad.push(el); };
  if(!r.log_no) flag("log_no", "Every entry needs a log number.");
  else if(S.records.some(x => x !== E.orig && String(x.log_no).toUpperCase() === r.log_no.toUpperCase())) flag("log_no", `Log ${r.log_no} is already in the ledger.`);
  ["acq_cost","disp_price"].forEach(k => { if(r[k]){ const p = parseMoney(r[k]); if(p.ok) r[k] = p.v; else flag(k, "Enter an amount, like 450 or 1,295.00."); } });
  let repBad = false;
  r.repairs = r.repairs.filter(x => x.date || x.desc || x.cost).map(x => { if(x.cost){ const p = parseMoney(x.cost); if(p.ok) x.cost = p.v; else repBad = true; } return x; });
  if(repBad){ M.toast("A repair cost isn't an amount. Use numbers like 85 or 12.50.", "error"); return; }
  if(bad.length){ bad[0] && bad[0].focus(); return; }
  if(!E.gone) DISP_KEYS.forEach(k => r[k] = "");
  if(!isNFA(r)) NFA_KEYS.forEach(k => r[k] = "");
  if(r.nfa_status === "PENDING"){ r.nfa_approved = ""; r.nfa_stamp = ""; }
  if(!hasOAL(r)) r.nfa_oal = "";
  if(isSuppressor(r)){ r.action = ""; r.barrel = ""; }
  if(r.type !== "OTHER") r.type_other = "";
  if(r.acq_source !== "OTHER") r.acq_source_other = "";
  if(r.disp_source !== "OTHER") r.disp_source_other = "";
  r.status = E.gone ? "DISPOSED" : "HELD";
  const now = stamp(); r.modified = now; if(!r.created) r.created = now;
  if(E.isNew) S.records.push(r); else { const i = S.records.indexOf(E.orig); if(i >= 0) S.records[i] = r; else S.records.push(r); }
  const dupSer = r.serial && S.records.filter(x => x !== r && x.serial && x.serial.toUpperCase() === r.serial.toUpperCase());
  M.editing = null; M.view = "list"; M.sel = r;
  markDirty(); M.render();
  M.toast((E.isNew ? `Added log ${r.log_no}.` : `Saved log ${r.log_no}.`) + (autoOn() ? "" : " Save the ledger to write it to the file."));
  if(dupSer && dupSer.length) M.toast(`Serial ${r.serial} also appears on log ${dupSer.map(x => x.log_no).join(", ")}.`, "error");
};

M.onClick = async e => {
  const t = e.target;

  if(menu && !t.closest(".q2-menu")) { menu.classList.remove("open"); }
  const fb = t.closest("[data-filter]"); if(fb){ M.filter = fb.dataset.filter; return M.render(); }
  const sb = t.closest("[data-sort]");
  if(sb){ const k = sb.dataset.sort; M.sort = { key:k, dir: M.sort.key === k ? -M.sort.dir : 1 }; return M.render(); }
  const row = t.closest("tr[data-idx]"); if(row){ M.sel = S.records[+row.dataset.idx]; M.render(); const c = $("q2").querySelector(".q2-card"); if(c) c.focus?.(); return; }
  const b = t.closest("[data-act]"); if(!b || b.tagName === "INPUT") return;
  const a = b.dataset.act;
  switch(a){
    case "menu": { const m = b.closest(".q2-menu"); const open = !m.classList.contains("open"); m.classList.toggle("open", open); b.setAttribute("aria-expanded", open); return; }
    case "new": return M.startEdit(blankRecord(), true);
    case "open": return M.open();
    case "save": return M.save(false);
    case "saveas": return M.save(true);
    case "export": return M.exportDialog(null);
    case "exportone": return M.exportDialog(M.sel);
    case "edit": return M.startEdit(M.sel, false);
    case "dispose": return M.startEdit(M.sel, false, { gone:true, focus:"disp_date" });
    case "undispose":
      if(!(await M.confirm("Mark as held?", `Log ${M.sel.log_no} goes back to held, and its disposition details are erased.`, "Mark as held"))) return;
      DISP_KEYS.forEach(k => M.sel[k] = ""); M.sel.status = "HELD"; M.sel.modified = stamp(); markDirty(); M.render(); return M.toast(`Log ${M.sel.log_no} is held again.`);
    case "delete": {
      const r = M.sel;
      if(!(await M.confirm(`Delete log ${r.log_no}?`, "This removes the entry from the ledger entirely. If it was sold or transferred, record a disposition instead; that keeps the paper trail.", "Delete entry", true))) return;
      S.records.splice(S.records.indexOf(r), 1); M.sel = null; markDirty(); M.render(); return M.toast(`Deleted log ${r.log_no}.`);
    }
    case "close": M.sel = null; return M.render();
    case "canceledit": { const o = M.editing && M.editing.orig; M.editing = null; M.view = "list"; M.sel = o || M.sel; return M.render(); }
    case "addrep": { const box = $("q2").querySelector("#q2-reps"); box.querySelector("[data-act=addrep]").insertAdjacentHTML("beforebegin", M.repRow({ date:"", desc:"", cost:"" })); box.querySelectorAll(".q2-rep-row input[type=date]")[box.querySelectorAll(".q2-rep-row").length - 1].focus(); return; }
    case "delrep": b.closest(".q2-rep-row").remove(); M.readForm(); return;
    case "autosave": S.autosave = !S.autosave; M.render(); if(S.autosave && S.fileHandle && S.dirty) autoWrite();
      return M.toast(S.autosave ? (S.fileHandle ? `Autosave on: changes are written to ${S.fileName} as you make them.` : "Autosave on. It starts once the ledger is saved to a file.") : "Autosave off.");
    case "recovery": setRecovery(!S.recovery); M.render(); return M.toast(S.recovery ? "Recovery copy on. A plaintext copy is kept in this browser's local storage." : "Recovery copy off and erased.");
    case "warnings": return M.showWarnings();
    case "dismisswarn": M.warnings = null; return M.render();
    case "fresh":
      if(!(await M.guardDiscard("Starting a new ledger"))) return;
      S.records = []; S.fileName = ""; S.fileHandle = null; markLoaded(); dropStash(); M.sel = null; M.warnings = null; M.render(); return;
    case "restore": { const st = M.restore; S.records = st.records; S.fileName = st.fileName || ""; markLoaded(); if(st.dirty){ S.revision = 1; S.dirty = true; } M.restore = null; M.render(); return M.toast("Recovery copy restored." + (S.fileName ? " Saving will ask where to write." : "")); }
    case "discardrestore": dropStash(); M.restore = null; return M.render();
    case "clearsearch": M.q = ""; M.filter = "ALL"; return M.render();

};

/* ═══════════════════════════════════════════════════════════════════════
   EASTER EGG — X at the vault scrolls a random piece of art, then clears
   ═══════════════════════════════════════════════════════════════════════ */
function easterEgg(){
  const pieces = [...document.querySelectorAll("script.egg")]
    .map(n => n.textContent.replace(/\r/g,"").replace(/^\n+|\s+$/g,""))
    .filter(t => t.trim());
  if(!pieces.length){ say("YOU TRY THE BACK ROOM. IT'S EMPTY. SOMEONE ALREADY TOOK THE CALENDAR."); return; }
  const lines = pieces[Math.floor(Math.random() * pieces.length)].split("\n");
  const widest = Math.max(...lines.map(l => l.length));
  const em = widest > COLS ? COLS / widest : 1;           // shrink art wider than 80 columns
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const timers = [];
  let done = false;
  const finish = () => { if(done) return; done = true; timers.forEach(clearTimeout); S.booting = false; cls(); goMenu(); };
  S.booting = true; S.skipBoot = finish;                   // any key or click ends it early
  psEl.textContent = ""; inp.value = ""; renderTyped();
  cls();
  const step = reduce ? 0 : 55;                            // roughly a 2400-baud crawl
  lines.forEach((l, i) => timers.push(setTimeout(() => {
    if(done) return;
    const d = ln(esc(l)); d.style.fontSize = em + "em";
    out.scrollTop = out.scrollHeight;
  }, i * step)));
  timers.push(setTimeout(finish, lines.length * step + 2500));
}

const ART = "⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣴⢶⣶⣶⠼⣦⣤⣼⣼⡆⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⠖⣯⠿⠟⠛⠻⢶⣿⣯⣿⣿⣃⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⣖⣺⡿⠿⠷⠶⠒⢶⣶⠖⠀⠉⡻⢻⣿⡇⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠀⣴⢻⣭⣫⣿⠁⠀⠀⠀⠀⠀⠀⠀⢀⣾⠃⢀⡏⠀⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⢀⣖⡿⠋⢙⣿⠿⢿⠿⣿⡦⠄⠀⠀⠀⣠⣾⠟⠀⠀⣼⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⢀⣰⣿⣴⣿⡿⠿⠿⠿⢿⣦⣄⠀⠀⠀⣠⣾⣿⠃⠀⢀⣸⡿⣳⣶⣲⡄⠀⠀⠀⠀⠀⠀\n⠀⠀⣾⣽⡿⣛⣵⠾⠿⠿⠷⣦⣌⠻⣷⣄⢰⣿⠟⠁⠀⢠⣾⠿⢡⣯⠸⠧⢽⣄⠀⠀⠀⠀⠀\n⠀⢸⡇⡟⣴⡿⢟⣽⣾⣿⣶⣌⠻⣧⣹⣿⡿⠋⠀⠀⠀⣾⠿⡇⣽⣿⣄⠀⠀⠉⠳⣄⢀⡀⠀\n⠀⢸⠇⢳⣿⢳⣿⣿⣿⣿⣿⣿⡆⢹⡇⣿⡇⠀⡆⣠⣼⡏⢰⣿⣿⣿⣿⣦⠀⠀⠀⠈⠳⣅⠀\n⠀⣸⡀⢸⣿⢸⣿⣿⣿⣿⣿⣿⡇⣸⡇⣿⡇⠀⡟⣻⢳⣷⣿⣿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠘⣧\n⢰⡟⡿⡆⠹⣧⡙⢿⣿⣿⠿⡟⢡⣿⢷⣿⣧⠾⢠⣿⣾⣿⣿⣿⣿⣿⣿⠁⠀⠀⠀⠀⠀⠀⠘\n⠀⠻⡽⣦⠀⠈⠙⠳⢶⣦⡶⠞⢻⡟⡸⠟⠁⢠⠟⠉⠉⠙⠿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠀⠀⡴\n⠀⠀⢸⣿⡇⠀⠀⣀⣠⠀⢀⡀⠸⣹⠇⠀⣰⡟⡀⠀⠈⠛⠻⢿⣻⣿⡿⠀⠀⠀⠀⠀⠀⡠⠁\n⠀⠀⢸⣿⣇⣴⢿⣿⣿⣿⣮⣿⣷⡟⠀⣰⣿⢰⠀⣀⠀⠀⠀⢀⣉⣿⡇⠀⠀⠀⠀⠀⣸⠃⠀\n⠀⠀⢸⣿⡟⣯⠸⣿⣿⣿⣿⢈⣿⡇⣼⣿⠇⣸⡦⣙⣷⣦⣴⣯⠿⠛⢷⡀⠀⠀⠀⣰⡟⠀⠀\n⠀⠀⠘⣿⣿⡸⣷⣝⠻⠟⢋⣾⣟⣰⡏⣠⣤⡟⠀⠀⠈⠉⠁⠀⠀⠀⠀⢻⣶⠀⢀⣿⠁⠀⠀\n⠀⠀⠀⢸⡿⣿⣦⣽⣛⣛⣛⣭⣾⣷⡶⠞⠋⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣼⣿⣿⡟⠀⠀⠀⠀\n⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⡀⠁⢸⢻⠁⠀⠀⠀⠀\n⠀⠀⠀⠀⡿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣧⣤⣤⣀⣀⣀⣀⣀⣠⣤⠶⠛⠁⢀⣾⡟⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⢿⣻⣿⣿⣿⣿⣿⣿⣎⣿⡅⠀⠈⠉⠉⠉⠉⠉⠁⠀⠀⠀⠀⣼⣿⠁⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠈⢻⣿⣿⣿⣿⣿⣿⣿⣿⣇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⡷⠟⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠙⢿⣿⣿⠻⢿⣿⣿⣟⣂⣀⣀⣀⣀⣀⣀⣤⠴⠋⠁⣾⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠈⢻⣿⣷⣷⡄⠀⠀⠀⠉⠉⠉⠉⠉⠀⠀⠀⢀⡞⠁⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠀⠀⠻⣿⣿⡆⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⠟⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀\n⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⣿⣷⣤⣤⣤⣤⣄⣤⣤⡤⠴⠞⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀";
function boot(){
  const lines = [
    [0,   "PHOSPHOR BIOS (C) 1990"],
    [120, "MEMORY TEST:  640K OK"],
    [260, ""],
    [300, `QUICKFIRE  VERSION ${VERSION}`],
    [380, "LOADING QFIRE.EXE ......... OK"],
  ];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const timers = [];
  let done = false;
  const at = (t, f) => timers.push(setTimeout(() => { if(!done) f(); }, t));
  const finish = () => { if(done) return; done = true; timers.forEach(clearTimeout); S.booting = false; cls(); afterBoot(); };
  S.skipBoot = finish;
  lines.forEach(([t, s]) => at(t, () => raw(s)));
  const artLines = ART.split("\n"), step = reduce ? 0 : 45, t0 = 750;
  let artEm = .82;
  at(t0, () => {
    cls(); blank();
    const fsPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 16;
    artEm = Math.max(.4, Math.min(.82, (out.clientHeight / fsPx - 9) / artLines.length));
  });
  artLines.forEach((l, i) => at(t0 + 30 + i * step, () => {
    const d = ln(`<span class="art">${esc(l)}</span>`);
    d.style.textAlign = "center"; d.style.fontSize = artEm + "em";
  }));
  const t1 = t0 + 60 + artLines.length * step;
  at(t1, () => {
    blank();
    ln(esc(spaced("QUICKFIRE"))).style.textAlign = "center";
    ln(`<span class="dim">${esc("FIREARM INVENTORY RECORD SYSTEM")}</span>`).style.textAlign = "center";
    blank();
    ln(`<span class="dim">${esc("PRESS ANY KEY")}</span>`).style.textAlign = "center";
    out.scrollTop = 0;
  });
  at(t1 + 3500, finish);
}
function afterBoot(){
  loadRecoveryPref();
  const st = S.recovery ? unstash() : null;
  let recs = [];
  if(st && st.unreadable){ goMenu("A RECOVERY COPY FROM AN UNKNOWN OR DAMAGED FORMAT WAS FOUND IN THIS BROWSER AND IGNORED."); return; }
  if(st){
    const res = parseLedger(st.csv);
    if(res.errors.length){ goMenu("THE RECOVERY COPY IN THIS BROWSER COULD NOT BE READ (" + res.errors[0] + "). IT WAS LEFT IN PLACE."); return; }
    recs = res.records;
  }
  if(recs.length){
    blank();
    say(`A WORKING COPY FROM ${new Date(st.savedAt).toLocaleString().toUpperCase()} IS STILL IN THIS BROWSER` + (st.fileName ? `, LAST SAVED AS ${st.fileName.toUpperCase()}` : "") + (st.dirty ? ". IT HAS CHANGES THAT WERE NEVER SAVED TO DISK." : "."));
    opts([["Y","Y","PICK UP WHERE YOU LEFT OFF"],["N","N","START CLEAN (DISCARDS IT)"]]);
    ask("RESTORE?", v => {
      if(/^N/i.test(v.trim())){ dropStash(); goMenu(); }
      else { S.records = recs; S.fileName = st.fileName || ""; markLoaded(); if(st.dirty){ S.revision = 1; S.dirty = true; } goMenu("WORKING COPY RESTORED." + (S.fileName && window.showSaveFilePicker ? " THE FIRST SAVE WILL ASK WHERE TO WRITE." : "")); }
    }, "Y RESTORE  N START CLEAN");
  } else goMenu();
}

/* ═══════════════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════════════ */
inp.addEventListener("keydown", e => {
  if(S.booting){ e.preventDefault(); S.skipBoot && S.skipBoot(); return; }
  if(e.key === "Enter"){ e.preventDefault(); submit(inp.value); return; }
  if(e.key === "ArrowUp"){ e.preventDefault(); if(S.hIdx > 0){ S.hIdx--; inp.value = S.history[S.hIdx]; renderTyped(); } return; }
  if(e.key === "ArrowDown"){ e.preventDefault(); if(S.hIdx < S.history.length){ S.hIdx++; inp.value = S.history[S.hIdx] || ""; renderTyped(); } return; }
  if(e.key === "PageUp"){ e.preventDefault(); out.scrollTop -= out.clientHeight * .9; return; }
  if(e.key === "PageDown"){ e.preventDefault(); out.scrollTop += out.clientHeight * .9; return; }
  setTimeout(renderTyped, 0);
});
inp.addEventListener("input", renderTyped);
inp.addEventListener("select", renderTyped);
document.addEventListener("selectionchange", () => { if(document.activeElement === inp) renderTyped(); });

document.addEventListener("keydown", e => {
  if(S.booting || S.ui === "q2") return;
  const k = e.key;
  if(k === "F1"){ e.preventDefault(); if(W) say("ENTER KEEPS THE BRACKETED VALUE.  -  CLEARS IT.  BACK RETURNS TO THE PREVIOUS FIELD.  ABORT ABANDONS THE ENTRY.", "dim"); else showHelp(); }
  else if(k === "F2" || ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "s")){ e.preventDefault(); if(W) say("FINISH OR ABORT THIS ENTRY FIRST, THEN SAVE."); else saveLogbook(e.shiftKey); }
  else if(k === "F3"){ e.preventDefault(); if(!W) startWizard(blankRecord(), true); }
  else if(k === "Escape"){
    e.preventDefault();
    if(inp.value){ inp.value = ""; renderTyped(); return; }
    if(W) confirmAbort(); else goMenu();
  }
});

document.addEventListener("click", e => {
  if(S.ui === "q2") return;
  if(S.booting){ S.skipBoot && S.skipBoot(); return; }
  const a = e.target.closest(".opt,.row");
  if(a){ e.preventDefault(); if(S.booting) return; submit(a.dataset.cmd); focusIn(); return; }
  if(!window.getSelection().toString()) focusIn();
});
document.addEventListener("keydown", e => {
  const a = document.activeElement;
  if(S.ui === "q2") return;
  if(a && (a.classList.contains("opt") || a.classList.contains("row")) && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); submit(a.dataset.cmd); focusIn(); }
}, true);

$("filepick").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  if(S.ui === "q2") M.adopt(await f.text(), f.name, null); else loadText(await f.text(), f.name, null);
  e.target.value = "";
});
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("dropveil").classList.add("on"); });
document.addEventListener("dragleave", e => { dragDepth--; if(dragDepth <= 0){ dragDepth = 0; $("dropveil").classList.remove("on"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; $("dropveil").classList.remove("on");
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  let handle = null;
  try{ if(item && item.getAsFileSystemHandle){ const h = await item.getAsFileSystemHandle(); if(h && h.kind === "file") handle = h; } }catch(_){}
  const f = handle ? await handle.getFile() : e.dataTransfer.files[0];
  if(!f) return;
  if(S.ui === "q2"){
    if(M.view === "edit") return M.toast("Finish or cancel the entry you're editing first.", "error");
    const text = await f.text();
    if(await M.guardDiscard(`Opening ${f.name}`)) M.adopt(text, f.name, handle);
    return;
  }
  if(W){ err("FINISH OR ABORT THIS ENTRY BEFORE OPENING ANOTHER LEDGER."); return; }
  const text = await f.text();
  if(S.dirty) return confirmDiscard(`LOADING ${f.name.toUpperCase()}`, () => loadText(text, f.name, handle));
  loadText(text, f.name, handle);
});

window.addEventListener("beforeunload", e => { if(S.dirty){ e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", fit);

document.fonts && document.fonts.ready.then(fit);
fit();
renderTop(); setInterval(renderTop, 20000);
renderStatus();
psEl.textContent = "";
renderTyped();
$("q2").addEventListener("click", M.onClick);
$("q2").addEventListener("input", M.onInput);
document.addEventListener("keydown", M.onKey);
if(savedUI() === "q2"){
  /* straight into Quickfire 2000: no boot sequence */
  S.booting = false;
  loadRecoveryPref();
  const st = S.recovery ? unstash() : null;
  if(st && !st.unreadable){ const res = parseLedger(st.csv); if(!res.errors.length && res.records.length) M.restore = { records: res.records, savedAt: st.savedAt, fileName: st.fileName, dirty: st.dirty }; }
  setUI("q2");
} else {
  focusIn();
  boot();
}
