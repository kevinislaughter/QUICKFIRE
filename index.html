:root{
  --fs:16px;
  --phos:#4dff88;      /* lit phosphor */
  --phos-dim:#22a352;  /* half intensity */
  --phos-faint:#0f5a2b;
  --tube:#020d05;      /* unlit tube */
  --bezel:#0b0d0b;
  --glow:rgba(77,255,136,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bezel);
  color:var(--phos);
  font-family:"VGA437","Perfect DOS VGA 437","Lucida Console","Courier New",monospace;
  font-size:var(--fs);
  line-height:1;
  overflow:hidden;
  -webkit-font-smoothing:none;
  font-smooth:never;
}
#crt{
  position:relative;
  height:100%;
  padding:clamp(6px,2vw,22px);
}
#tube{
  position:relative;
  height:100%;
  background:radial-gradient(ellipse at center, #04210d 0%, var(--tube) 70%, #010603 100%);
  border-radius:clamp(6px,1.6vw,18px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.9), inset 0 0 6px rgba(77,255,136,.15), 0 0 0 2px #151a15;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:calc(var(--fs)*.75) calc(var(--fs)*1);
}
/* scanlines + slight vignette, above text, ignore clicks */
#tube::after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
  z-index:5;
}
.glow, #tube{ text-shadow:0 0 1px var(--phos), 0 0 6px var(--glow); }
@media (prefers-reduced-motion:no-preference){
  #tube{ animation:hum 6s infinite steps(60); }
  @keyframes hum{ 0%,100%{filter:brightness(1)} 47%{filter:brightness(1)} 48%{filter:brightness(.96)} 49%{filter:brightness(1.02)} }
}
.bar{
  flex:0 0 auto;
  background:var(--phos);
  color:var(--tube);
  text-shadow:none;
  white-space:pre;
  overflow:hidden;
  box-shadow:0 0 8px var(--glow);
}
#out{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:auto;
  padding:calc(var(--fs)*.5) 0;
  scrollbar-width:thin;
  scrollbar-color:var(--phos-faint) transparent;
}
.ln{white-space:pre;min-height:1em}
.dim{color:var(--phos-dim)}
.q{color:var(--phos)}
.cur{color:var(--phos-dim)}
.inv{background:var(--phos);color:var(--tube);text-shadow:none}
.opt,.row{
  color:inherit;text-decoration:none;cursor:pointer;
}
.opt:hover,.row:hover,.opt:focus-visible,.row:focus-visible{
  background:var(--phos);color:var(--tube);text-shadow:none;outline:none;
}
.okey{color:var(--phos)}
#promptline{
  flex:0 0 auto;
  position:relative;
  white-space:pre-wrap;
  word-break:break-all;
  padding:calc(var(--fs)*.25) 0 calc(var(--fs)*.5);
  overflow:hidden;
}
#ps{color:var(--phos)}
.cursor{
  display:inline-block;
  width:.5625em;height:1em;
  background:var(--phos);
  vertical-align:top;
  box-shadow:0 0 6px var(--glow);
}
.cursor.over{color:var(--tube);text-shadow:none;width:auto}
@media (prefers-reduced-motion:no-preference){
  .cursor{animation:blink 1.06s steps(1) infinite}
  @keyframes blink{50%{background:transparent;color:inherit;box-shadow:none;text-shadow:inherit}}
}
#in{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0;
  font-size:16px; /* prevents iOS zoom */
  border:0;background:transparent;color:transparent;caret-color:transparent;
}
#dropveil{
  position:absolute;inset:0;z-index:6;display:none;
  align-items:center;justify-content:center;
  background:rgba(2,13,5,.85);
  white-space:pre;
}
#dropveil.on{display:flex}
.art{font-family:"Segoe UI Symbol","Apple Braille","Noto Sans Symbols 2","DejaVu Sans",monospace;font-size:1em;line-height:1;letter-spacing:0}
#printout{display:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#filepick{display:none}

/* ═════════════ QUICKFIRE 2000 ═════════════ */
#q2{display:none}
html.q2 body{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#F5F7F5; --ink:#18201B; --muted:#5B675F; --rule:#D3DAD4;
  --accent:#3E5A47; --accent-ink:#FFFFFF; --brass:#9C7424; --danger:#A23B2C; --focus:#2F6FD6;
  --serif:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45;
  overflow:auto; -webkit-font-smoothing:auto; text-shadow:none;
}
@media (prefers-color-scheme:dark){
  html.q2 body{ --bg:#121714; --surface:#1A201C; --sunk:#161B18; --ink:#E4E9E5; --muted:#97A39B; --rule:#2C3530;
    --accent:#86AE92; --accent-ink:#0F1511; --brass:#D0A64E; --danger:#E0715F; --focus:#7FA8F0; }
}
html.q2 #crt{display:none}
html.q2 #q2{display:block; min-height:100%}
#q2 *{box-sizing:border-box}
#q2 button,#q2 input,#q2 select,#q2 textarea{font:inherit;color:inherit}
#q2 :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#q2 .num{font-variant-numeric:tabular-nums}
#q2 .ser{font-family:var(--mono);font-size:.92em}

/* header */
.q2-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px clamp(14px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--rule)}
.q2-mark{font-family:var(--serif);font-size:1.35rem;font-weight:700;letter-spacing:-.01em;margin:0}
.q2-mark span{font-weight:400;color:var(--muted)}
.q2-file{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;min-width:0}
.q2-file b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.q2-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.q2-dot.wet{background:var(--brass)}
.q2-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q2-btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.q2-btn:hover{border-color:var(--muted)}
.q2-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.q2-btn.danger{color:var(--danger)}
.q2-btn.plain{border-color:transparent;background:transparent}
.q2-btn:disabled{opacity:.45;cursor:default}
.q2-menu{position:relative}
.q2-menu-list{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:none;z-index:20}
.q2-menu.open .q2-menu-list{display:block}
.q2-menu-list button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer}
.q2-menu-list button:hover{background:var(--sunk)}
.q2-menu-list small{color:var(--muted)}
.q2-menu-list hr{border:0;border-top:1px solid var(--rule);margin:6px 4px}

/* banners */
.q2-banner{margin:14px clamp(14px,3vw,32px) 0;padding:10px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.q2-banner.warn{border-color:var(--brass)}
.q2-banner p{margin:0;flex:1 1 300px}

/* main layout */
.q2-main{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding:16px clamp(14px,3vw,32px) 40px}
.q2-main.has-detail{grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:24px}
@media (max-width:980px){ .q2-main.has-detail{grid-template-columns:minmax(0,1fr)} .q2-main.has-detail .q2-list{display:none} }

.q2-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q2-search{flex:1 1 260px;max-width:420px;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.q2-seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.q2-seg button{border:0;background:none;padding:7px 12px;cursor:pointer;border-right:1px solid var(--rule)}
.q2-seg button:last-child{border-right:0}
.q2-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.q2-count{color:var(--muted);font-size:.9rem;margin-left:auto}

.q2-tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.q2-table{width:100%;border-collapse:collapse;font-size:.94rem}
.q2-table th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;
  border-bottom:1px solid var(--rule);padding:0;white-space:nowrap}
.q2-table th button{border:0;background:none;padding:9px 12px;width:100%;text-align:inherit;cursor:pointer;color:inherit;font-weight:inherit}
.q2-table th[aria-sort] button{color:var(--ink)}
.q2-table td{padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.q2-table tbody tr{cursor:pointer}
.q2-table tbody tr:hover td{background:var(--sunk)}
.q2-table tbody tr[aria-selected="true"] td{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.q2-table tbody tr:last-child td{border-bottom:0}
.q2-table .gone td{color:var(--muted)}
.q2-tag{display:inline-block;font-size:.78rem;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.q2-tag.nfa{border-color:var(--brass);color:var(--brass)}
.q2-tag.gone{border-style:dashed}

.q2-empty{padding:56px 24px;text-align:center;background:var(--surface);border:1px dashed var(--rule);border-radius:8px}
.q2-empty h2{font-family:var(--serif);font-weight:600;margin:0 0 6px}
.q2-empty p{color:var(--muted);margin:0 0 18px}

/* detail: the ledger card */
.q2-card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.q2-card-head{position:relative;padding:18px 20px 14px;border-bottom:2px solid var(--ink)}
.q2-card-head .q2-close{position:absolute;top:10px;right:10px}
.q2-card-head .log{color:var(--muted);font-size:.9rem}
.q2-card-head h2{font-family:var(--serif);font-size:1.5rem;line-height:1.2;margin:2px 0 6px;font-weight:600}
.q2-card-acts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--rule)}
.q2-sec{padding:14px 20px 4px;border-bottom:1px solid var(--rule)}
.q2-sec:last-child{border-bottom:0}
.q2-sec h3{font-size:.95rem;margin:0 0 8px;font-weight:600}
.q2-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0}
.q2-grid div{padding:5px 0 7px;border-bottom:1px dotted var(--rule);min-width:0}
.q2-grid div.wide{grid-column:1 / -1}
.q2-grid dt{font-size:.78rem;color:var(--muted)}
.q2-grid dd{margin:1px 0 0;font-family:var(--serif);font-size:1.02rem;overflow-wrap:anywhere;white-space:pre-wrap}
.q2-grid dd:empty::before{content:"—";color:var(--rule)}
.q2-reps{width:100%;border-collapse:collapse;font-size:.92rem;margin-bottom:10px}
.q2-reps td{padding:5px 0;border-bottom:1px dotted var(--rule);vertical-align:top}
.q2-reps td:first-child{width:7.5em;color:var(--muted)}
.q2-reps td:last-child{text-align:right;width:6em}

/* editor */
.q2-editor{background:var(--surface);border:1px solid var(--rule);border-radius:8px;width:100%;max-width:920px;margin:0 auto}
.q2-editor header{display:flex;align-items:baseline;gap:12px;padding:18px 22px;border-bottom:2px solid var(--ink)}
.q2-editor header h2{font-family:var(--serif);font-size:1.45rem;margin:0;font-weight:600}
.q2-editor fieldset{border:0;border-bottom:1px solid var(--rule);margin:0;padding:16px 22px 18px}
.q2-editor legend{font-weight:600;padding:0;margin-bottom:10px;float:left;width:100%}
.q2-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px;clear:both}
.q2-f{display:flex;flex-direction:column;gap:4px}
.q2-f.wide{grid-column:1 / -1}
.q2-f label{font-size:.85rem;color:var(--muted)}
.q2-f input,.q2-f select,.q2-f textarea{padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);width:100%}
.q2-f textarea{min-height:64px;resize:vertical}
.q2-f[hidden]{display:none}
.q2-f .bad{border-color:var(--danger)}
.q2-f .msg{color:var(--danger);font-size:.82rem}
.q2-check{display:flex;gap:8px;align-items:center;clear:both;margin-bottom:12px}
.q2-rep-row{display:grid;grid-template-columns:150px 1fr 120px auto;gap:8px;margin-bottom:8px;align-items:center}
.q2-rep-row input{padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);width:100%}
@media (max-width:600px){ .q2-rep-row{grid-template-columns:1fr 1fr} .q2-rep-row .d{grid-column:1 / -1} .q2-grid{grid-template-columns:1fr} }
.q2-editor footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;flex-wrap:wrap;align-items:center}
.q2-editor footer .note{margin-right:auto;color:var(--muted);font-size:.9rem}

/* dialog + toasts */
#q2 dialog{border:1px solid var(--rule);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:88vh}
#q2 dialog::backdrop{background:rgba(10,14,12,.45)}
.q2-dlg{padding:20px 22px}
.q2-dlg h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 8px}
.q2-dlg p{margin:0 0 12px;color:var(--muted)}
.q2-dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.q2-dlg fieldset{border:0;padding:0;margin:0 0 14px}
.q2-dlg legend{font-weight:600;margin-bottom:6px}
.q2-dlg label.opt2{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.q2-dlg ul{margin:0;padding-left:18px;max-height:50vh;overflow:auto;font-size:.92rem}
.q2-pre{max-height:55vh;overflow:auto;background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre;line-height:1.25}
#q2 dialog.wide{width:min(1000px,96vw)}
.q2-toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,92vw)}
.q2-toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.q2-toast.error{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){ .q2-toast{animation:q2in .18s ease-out} @keyframes q2in{from{opacity:0;transform:translateY(6px)}} }
#q2 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000;overflow:visible;font-size:9pt;height:auto}
  #crt{display:none}
  #q2{display:none !important}
  #printout{display:block;white-space:pre;font-family:"VGA437","Courier New",monospace;line-height:1;color:#000;text-shadow:none}
  #printout.wide{font-size:6.2pt}
  .pb{break-after:page}
}
</style>
</head>
<body>
<div id="crt">
  <div id="tube">
    <div id="topbar" class="bar"></div>
    <div id="out" aria-label="Terminal output"></div>
    <div id="sr" aria-live="polite" class="sr-only"></div>
    <div id="promptline"><span id="ps"></span><span id="typed"></span><input id="in" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Command input"></div>
    <div id="statusbar" class="bar"></div>
    <div id="dropveil">DROP THE .CSV LEDGER TO OPEN IT</div>
  </div>
</div>
<div id="q2"></div>
<pre id="printout"></pre>
<input type="file" id="filepick" accept=".csv,text/csv">

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   CONSTANTS & DATA MODEL
   ═══════════════════════════════════════════════════════════════════════ */
const VERSION = "1.0";
const COLS = 80;
const STORE_KEY = "firearm-logbook:working-copy";

const CSV_COLS = [
  "log_no","status","type","type_other","make","model","year","caliber","serial",
  "action","finish","barrel","notes",
  "nfa_item","nfa_form","nfa_registrant_type","nfa_registrant","nfa_status","nfa_submitted","nfa_approved","nfa_stamp","nfa_oal",
  "acq_source","acq_source_other","acq_date","acq_condition","acq_name","acq_cost","acq_address",
  "repairs",
  "disp_source","disp_source_other","disp_date","disp_price","disp_name","disp_id","disp_phone",
  "disp_dob","disp_other","disp_address",
  "created","modified"
];
const CH_TYPE = ["RIFLE","SHOTGUN","HANDGUN","NFA","OTHER"];
const CH_NFA_ITEM = ["SUPPRESSOR","SBR","SBS","AOW","MACHINE GUN","DESTRUCTIVE DEVICE"];
const NFA_SHORT = { "SUPPRESSOR":"SUPP", "SBR":"SBR", "SBS":"SBS", "AOW":"AOW", "MACHINE GUN":"MG", "DESTRUCTIVE DEVICE":"DD" };
const CH_NFA_FORM = ["FORM 4","FORM 1","FORM 5","OTHER"];
const CH_NFA_REG = ["TRUST","INDIVIDUAL","CORPORATION"];
const CH_NFA_STATUS = ["PENDING","APPROVED"];
const NFA_KEYS = ["nfa_item","nfa_form","nfa_registrant_type","nfa_registrant","nfa_status","nfa_submitted","nfa_approved","nfa_stamp","nfa_oal"];
const DISP_KEYS = ["disp_source","disp_source_other","disp_date","disp_price","disp_name","disp_id","disp_phone","disp_dob","disp_other","disp_address"];
const isNFA = r => r.type === "NFA";
const isSuppressor = r => isNFA(r) && r.nfa_item === "SUPPRESSOR";
const hasOAL = r => isNFA(r) && ["SBR","SBS","AOW"].includes(r.nfa_item);
const CH_SRC  = ["STORE","SHOW","PRIVATE","OTHER"];
const CH_COND = ["NEW","USED"];

const S = {
  records: [],
  dirty: false,
  fileHandle: null,
  fileName: "",
  handler: null,
  screen: null,          // function that redraws the current screen
  hint: "",
  history: [], hIdx: -1,
  br: { page:0, filter:"ALL", sort:"LOG#", q:"" },
  cur: null,
  sound: true,
  autosave: true,
  writeChain: Promise.resolve(),
  revision: 0,          // bumps on every change
  savedRevision: 0,     // highest revision known to be on disk (or downloaded)
  recovery: true,       // keep a plaintext recovery copy in localStorage
  stashOK: true,
  stashWarned: false,
  booting: true,
};

function blankRecord(){
  const r = {};
  CSV_COLS.forEach(c => r[c] = "");
  r.repairs = [];
  return r;
}
function clone(r){ const c = Object.assign({}, r); c.repairs = (r.repairs||[]).map(x => Object.assign({}, x)); return c; }
function isDisposed(r){ return r.status === "DISPOSED" || !!(r.disp_source || r.disp_date || r.disp_name || r.disp_price); }
function typeOf(r, short){
  if(isNFA(r)) return short ? "NFA/" + (NFA_SHORT[r.nfa_item] || "?") : ("NFA" + (r.nfa_item ? ": " + r.nfa_item : ""));
  return r.type === "OTHER" ? (r.type_other || "OTHER") : (r.type || "");
}
function srcOf(r, p){ return r[p+"_source"] === "OTHER" ? (r[p+"_source_other"] || "OTHER") : (r[p+"_source"] || ""); }
/* YYNN: last two digits of the year, then the order of arrival that year (2403 = third item of 2024) */
function nextLogNo(){
  const yy = String(new Date().getFullYear() % 100).padStart(2,"0");
  let max = 0;
  S.records.forEach(r => { const m = new RegExp("^" + yy + "(\\d{2,})$").exec(String(r.log_no).trim()); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return yy + String(max + 1).padStart(2,"0");
}
function stats(){
  const n = S.records.length, d = S.records.filter(isDisposed).length;
  return { n, d, h: n - d };
}

/* ═══════════════════════════════════════════════════════════════════════
   STRING HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = (s,n) => { s = String(s ?? ""); return s.length > n ? s.slice(0,n) : s + " ".repeat(n - s.length); };
const padL = (s,n) => { s = String(s ?? ""); return s.length > n ? s.slice(0,n) : " ".repeat(n - s.length) + s; };
const cut = (s,n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n-1) + "~" : s; };
const center = (s,n,ch=" ") => { s = String(s); const l = Math.floor((n - s.length)/2); return ch.repeat(Math.max(0,l)) + s + ch.repeat(Math.max(0, n - l - s.length)); };
const spaced = s => s.split(" ").map(w => w.split("").join(" ")).join("   ");

function wrap(text, width){
  text = String(text ?? "").replace(/\r/g,"");
  if(!text) return [""];
  const out = [];
  text.split("\n").forEach(para => {
    let line = "";
    para.split(/ +/).forEach(word => {
      while(word.length > width){
        if(line){ out.push(line); line = ""; }
        out.push(word.slice(0,width)); word = word.slice(width);
      }
      if(!line) line = word;
      else if((line + " " + word).length <= width) line += " " + word;
      else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}

/* dates are stored ISO (YYYY-MM-DD), shown MM/DD/YYYY */
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${m[2]}/${m[3]}/${m[1]}` : (iso || "");
}
function parseDate(input){
  const s = input.trim().toUpperCase();
  if(s === "TODAY" || s === "T"){ const d = new Date(); return { ok:true, v: isoOf(d.getFullYear(), d.getMonth()+1, d.getDate()) }; }
  let y, m, d, k;
  if((k = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(s))) { y=+k[1]; m=+k[2]; d=+k[3]; }
  else if((k = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/.exec(s))) { m=+k[1]; d=+k[2]; y=+k[3]; if(k[3].length===2) y += (y <= (new Date().getFullYear()%100)) ? 2000 : 1900; }
  else if((k = /^(\d{1,2})[-\/.](\d{4})$/.exec(s))) { m=+k[1]; d=1; y=+k[2]; }
  else if((k = /^(\d{4})$/.exec(s))) { y=+k[1]; m=1; d=1; }
  else return { ok:false, msg:"DATE NOT UNDERSTOOD. USE MM/DD/YYYY (OR TODAY)." };
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return { ok:false, msg:"THAT DATE DOES NOT EXIST ON ANY CALENDAR I OWN." };
  return { ok:true, v: isoOf(y,m,d) };
}
const isoOf = (y,m,d) => `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function parseMoney(input){
  const s = input.replace(/[$,\s]/g,"");
  if(!/^\d*(\.\d{0,2})?$/.test(s) || s === "" || s === ".") return { ok:false, msg:"ENTER AN AMOUNT, E.G. 450 OR 1,295.00" };
  return { ok:true, v: Number(s).toFixed(2) };
}
function fmtMoney(v){
  if(v === "" || v == null) return "";
  const n = Number(v); if(isNaN(n)) return String(v);
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
}
const stamp = () => { const d = new Date(); return isoOf(d.getFullYear(), d.getMonth()+1, d.getDate()) + " " + [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2,"0")).join(":"); };
const todayISO = () => { const d = new Date(); return isoOf(d.getFullYear(), d.getMonth()+1, d.getDate()); };

/* ═══════════════════════════════════════════════════════════════════════
   CSV
   ═══════════════════════════════════════════════════════════════════════ */
function csvCell(v){
  v = String(v ?? "");
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function repairsToCell(reps){
  return (reps||[]).map(x => [x.date||"", (x.desc||"").replace(/\n/g," "), x.cost||""].join(" | ")).join("\n");
}
function cellToRepairs(cell){
  if(!cell) return [];
  return String(cell).split(/\r?\n/).filter(l => l.trim()).map(l => {
    const p = l.split(" | ");
    if(p.length < 3) return { date:"", desc:l.trim(), cost:"" };
    return { date:p[0].trim(), cost:p[p.length-1].trim(), desc:p.slice(1,-1).join(" | ").trim() };
  });
}
function toCSV(recs){
  const lines = [CSV_COLS.join(",")];
  recs.forEach(r => {
    const row = CSV_COLS.map(c => {
      if(c === "repairs") return csvCell(repairsToCell(r.repairs));
      if(c === "status") return csvCell(isDisposed(r) ? "DISPOSED" : "HELD");
      return csvCell(r[c]);
    });
    lines.push(row.join(","));
  });
  return "\uFEFF" + lines.join("\r\n") + "\r\n";
}
function parseCSV(text){
  /* strict RFC-4180-style parser: rejects stray or unterminated quotes instead of guessing */
  text = text.replace(/^\uFEFF/,"");
  const rows = [];
  let row = [], f = "", q = false, quoted = false, line = 1, rowLine = 1, quoteLine = 1;
  const fail = msg => { throw new Error(`${msg} (CSV LINE ${line}, FIELD ${row.length + 1})`); };
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else { if(c === "\n") line++; f += c; }
      continue;
    }
    if(c === '"'){
      if(f !== "" || quoted) fail("STRAY QUOTE MARK INSIDE A FIELD");
      q = true; quoted = true; quoteLine = line; continue;
    }
    if(c === ","){ row.push(f); f = ""; quoted = false; continue; }
    if(c === "\n"){ row.push(f); rows.push({ cells:row, line:rowLine }); row = []; f = ""; quoted = false; line++; rowLine = line; continue; }
    if(c === "\r") continue;
    if(quoted){ if(c === " " || c === "\t") continue; fail("TEXT AFTER A CLOSING QUOTE"); }
    f += c;
  }
  if(q) throw new Error(`A QUOTED FIELD STARTING ON CSV LINE ${quoteLine} IS NEVER CLOSED`);
  if(f !== "" || row.length || quoted){ row.push(f); rows.push({ cells:row, line:rowLine }); }
  return rows.filter(r => r.cells.some(x => x.trim() !== ""));
}
const ENUMS = { status:["HELD","DISPOSED"], type:CH_TYPE, acq_source:CH_SRC, disp_source:CH_SRC, acq_condition:CH_COND,
  nfa_item:CH_NFA_ITEM, nfa_form:CH_NFA_FORM, nfa_registrant_type:CH_NFA_REG, nfa_status:CH_NFA_STATUS };
const DATE_KEYS = ["acq_date","disp_date","disp_dob","nfa_submitted","nfa_approved"];
const MONEY_KEYS = ["acq_cost","disp_price"];
function validateRecord(r, line, warn){
  const id = r.log_no ? `LOG #${r.log_no}` : `CSV LINE ${line}`;
  for(const [k, list] of Object.entries(ENUMS)) if(r[k] && !list.includes(r[k])) warn(`${id}: ${k.toUpperCase()} "${r[k]}" IS NOT ONE OF ${list.join("/")}.`);
  DATE_KEYS.forEach(k => { if(r[k] && !/^\d{4}-\d{2}-\d{2}$/.test(r[k])) warn(`${id}: ${k.toUpperCase()} "${r[k]}" IS NOT A DATE QUICKFIRE UNDERSTANDS.`); });
  MONEY_KEYS.forEach(k => { if(r[k] && isNaN(Number(r[k]))) warn(`${id}: ${k.toUpperCase()} "${r[k]}" IS NOT AN AMOUNT.`); });
  r.repairs.forEach((x, i) => {
    if(x.date && !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) warn(`${id}: REPAIR ${i+1} DATE "${x.date}" IS NOT A DATE QUICKFIRE UNDERSTANDS.`);
    if(x.cost && isNaN(Number(x.cost))) warn(`${id}: REPAIR ${i+1} COST "${x.cost}" IS NOT AN AMOUNT.`);
  });
}
/* parse + validate a whole ledger without touching S; errors block loading, warnings don't */
function parseLedger(text){
  const errors = [], warnings = [], records = [];
  let rows;
  try{ rows = parseCSV(text); }catch(e){ return { records, warnings, errors:[String(e.message || e).toUpperCase()] }; }
  if(!rows.length) return { records, warnings, errors };
  const norm = h => h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
  const head = rows[0].cells.map(norm);
  if(!head.includes("log_no")) errors.push("NO LOG_NO COLUMN IN THE HEADER ROW. THIS DOESN'T LOOK LIKE A QUICKFIRE LEDGER.");
  const dupCols = head.filter((h, i) => h && head.indexOf(h) !== i);
  if(dupCols.length) errors.push(`THE HEADER REPEATS ${[...new Set(dupCols)].join(", ").toUpperCase()}.`);
  const unknown = head.filter(h => h && !CSV_COLS.includes(h));
  if(unknown.length) warnings.push(`IGNORED UNKNOWN COLUMNS: ${unknown.join(", ").toUpperCase()}.`);
  const missing = CSV_COLS.filter(c => !head.includes(c));
  if(missing.length && head.includes("log_no")) warnings.push(`MISSING COLUMNS, LEFT BLANK: ${missing.join(", ").toUpperCase()}.`);
  if(errors.length) return { records, warnings, errors };
  const seen = new Map();
  rows.slice(1).forEach(({ cells, line }) => {
    if(cells.length > head.length && cells.slice(head.length).some(x => x.trim() !== ""))
      errors.push(`CSV LINE ${line} HAS ${cells.length} FIELDS BUT THE HEADER HAS ${head.length}. A COMMA OR QUOTE IS PROBABLY OUT OF PLACE.`);
    else if(cells.length < head.length) warnings.push(`CSV LINE ${line} HAS ONLY ${cells.length} OF ${head.length} FIELDS; THE REST WERE LEFT BLANK.`);
    const r = blankRecord();
    head.forEach((h, i) => {
      if(h === "repairs") r.repairs = cellToRepairs(cells[i]);
      else if(h in r) r[h] = (cells[i] ?? "").trim();
    });
    normalize(r);
    validateRecord(r, line, m => warnings.push(m));
    const key = String(r.log_no).trim().toUpperCase();
    if(!key) warnings.push(`CSV LINE ${line} HAS NO LOG NUMBER.`);
    else if(seen.has(key)) errors.push(`DUPLICATE LOG NUMBER ${r.log_no} ON CSV LINES ${seen.get(key)} AND ${line}.`);
    else seen.set(key, line);
    records.push(r);
  });
  return { records, warnings, errors };
}
function recordsFromCSV(text){
  const res = parseLedger(text);
  if(res.errors.length) throw new Error(res.errors[0]);
  return res.records;
}

/* spreadsheets like to "help" with dates and currency; undo that on load */
function normDate(v){ if(!v || /^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const p = parseDate(v); return p.ok ? p.v : v; }
function normMoney(v){ if(!v) return v; const p = parseMoney(v); return p.ok ? p.v : v; }
function normalize(r){
  ["acq_date","disp_date","disp_dob"].forEach(k => r[k] = normDate(r[k]));
  ["acq_cost","disp_price"].forEach(k => r[k] = normMoney(r[k]));
  ["status","type","acq_source","disp_source","acq_condition","nfa_item","nfa_form","nfa_registrant_type","nfa_status"].forEach(k => r[k] = (r[k]||"").toUpperCase());
  ["nfa_submitted","nfa_approved"].forEach(k => r[k] = normDate(r[k]));
  r.repairs.forEach(x => { x.date = normDate(x.date); x.cost = normMoney(x.cost); });
}

/* ═══════════════════════════════════════════════════════════════════════
   RECORD SCREEN / EXPORT RENDERERS
   ═══════════════════════════════════════════════════════════════════════ */
function bannerBox(t, t2){
  const inner = COLS - 2;
  const mid = ["║" + center(t, inner) + "║"];
  if(t2) mid.push("║" + center(t2, inner) + "║");
  return ["╔" + "═".repeat(inner) + "╗", ...mid, "╚" + "═".repeat(inner) + "╝"];
}
function rule(t, ch="═", w=COLS){
  if(!t) return ch.repeat(w);
  return center(" " + t + " ", w, ch);
}
function kv(label, val, width){
  const head = label + ": ";
  const lines = wrap(val || "", Math.max(8, width - head.length));
  return lines.map((ln,i) => (i ? " ".repeat(head.length) : head) + ln);
}
function pair(l1,v1,l2,v2){
  const a = kv(l1,v1,38), b = l2 ? kv(l2,v2,40) : [];
  const n = Math.max(a.length, b.length), out = [];
  for(let i=0;i<n;i++) out.push((" " + pad(a[i]||"",38) + " " + (b[i]||"")).replace(/\s+$/,""));
  return out;
}
function full(l,v){ return kv(l,v,COLS-1).map(x => (" " + x).replace(/\s+$/,"")); }

function recordScreen(r){
  const L = [];
  L.push(...bannerBox(spaced("QUICKFIRE"), spaced("FIREARM LOG RECORD")));
  L.push(rule("DESCRIPTION OF FIREARM"));
  L.push(...pair("LOG NUMBER", r.log_no, "TYPE", typeOf(r)));
  L.push(...pair("MANUFACTURER/IMPORTER", r.make, "MODEL", r.model));
  L.push(...pair("YEAR", r.year, "CALIBER/GAUGE", r.caliber));
  L.push(...pair("SERIAL NO", r.serial, "ACTION TYPE", r.action));
  L.push(...pair("FINISH", r.finish, "BARREL", r.barrel));
  L.push(...full("NOTES", r.notes));
  if(isNFA(r)){
    L.push(rule("NFA REGISTRATION"));
    L.push(...pair("ITEM", r.nfa_item, "FORM", r.nfa_form));
    L.push(...pair("REGISTERED TO", r.nfa_registrant_type, "STATUS", r.nfa_status));
    L.push(...full("REGISTRANT", r.nfa_registrant));
    L.push(...pair("SUBMITTED", fmtDate(r.nfa_submitted), "APPROVED", fmtDate(r.nfa_approved)));
    L.push(...pair("TAX STAMP #", r.nfa_stamp, hasOAL(r) ? "OVERALL LENGTH" : "", hasOAL(r) ? r.nfa_oal : ""));
  }
  L.push(rule("RECEIVED"));
  L.push(...pair("DATE", fmtDate(r.acq_date), "VIA", srcOf(r,"acq")));
  L.push(...pair("CONDITION", r.acq_condition, "COST", fmtMoney(r.acq_cost)));
  L.push(...full("FROM COMPANY/NAME", r.acq_name));
  L.push(...full("FFL # or ADDRESS", r.acq_address));
  L.push(rule("REPAIRS / MODIFICATIONS"));
  if(!r.repairs || !r.repairs.length) L.push(" NONE ON RECORD");
  else {
    L.push(" " + pad("DATE",12) + pad("DESCRIPTION",54) + padL("COST",12));
    L.push(" " + "─".repeat(78));
    r.repairs.forEach((x,i) => {
      const d = wrap(x.desc, 52);
      d.forEach((ln,j) => L.push((" " + (j ? " ".repeat(12) : pad(fmtDate(x.date),12)) + pad(ln,54) + (j ? "" : padL(fmtMoney(x.cost),12))).replace(/\s+$/,"")));
    });
  }
  if(isDisposed(r)){
    L.push(rule("DISPOSED"));
    L.push(...pair("DATE", fmtDate(r.disp_date), "VIA", srcOf(r,"disp")));
    L.push(...pair("PRICE", fmtMoney(r.disp_price), "PHONE", r.disp_phone));
    L.push(...full("TO NAME", r.disp_name));
    L.push(...pair("ID #", r.disp_id, "D.O.B.", fmtDate(r.disp_dob)));
    L.push(...full("OTHER", r.disp_other));
    L.push(...full("ADDRESS", r.disp_address));
  }
  L.push(rule(isDisposed(r) ? "OUT OF POSSESSION" : "IN POSSESSION"));
  return L.join("\n");
}

/* CP437 → 7-bit: what a printer with the high bit stripped did to box art */
const CP437 = { "═":0xCD,"║":0xBA,"╔":0xC9,"╗":0xBB,"╚":0xC8,"╝":0xBC,"─":0xC4,"│":0xB3,"┌":0xDA,"┐":0xBF,"└":0xC0,"┘":0xD9,"├":0xC3,"┤":0xB4,"┬":0xC2,"┴":0xC1,"┼":0xC5,"█":0xDB,"░":0xB0,"▒":0xB1,"▓":0xB2 };
function to7bit(s){
  return Array.from(s).map(ch => {
    if(CP437[ch] !== undefined) return String.fromCharCode(CP437[ch] & 0x7F);
    const c = ch.charCodeAt(0);
    return c < 128 ? ch : "?";
  }).join("");
}

function ledgerText(recs){
  const cols = [["LOG#",6],["TYPE",8],["MAKE",15],["MODEL",15],["CAL/GA",9],["SERIAL",14],["ACQUIRED",10],["FROM",16],["COST",10],["DISPOSED",10],["TO",13]];
  const W = cols.reduce((a,c) => a + c[1], 0) + cols.length - 1;
  const row = vals => cols.map((c,i) => (c[0]==="COST" ? padL(vals[i], c[1]) : pad(cut(vals[i], c[1]), c[1]))).join(" ").replace(/\s+$/,"");
  const L = [];
  L.push(center(spaced("QUICKFIRE"), W));
  L.push(center("F I R E A R M   L E D G E R", W));
  L.push(center(`${recs.length} RECORD${recs.length===1?"":"S"}   PRINTED ${fmtDate(todayISO())}`, W));
  L.push("=".repeat(W));
  L.push(row(cols.map(c => c[0])));
  L.push("-".repeat(W));
  recs.forEach(r => L.push(row([r.log_no, typeOf(r, true), r.make, r.model, r.caliber, r.serial, fmtDate(r.acq_date), r.acq_name, fmtMoney(r.acq_cost), fmtDate(r.disp_date), r.disp_name])));
  L.push("=".repeat(W));
  const tot = recs.reduce((a,r) => a + (Number(r.acq_cost)||0), 0);
  const s = { n: recs.length, d: recs.filter(isDisposed).length };
  L.push(`HELD: ${s.n - s.d}   DISPOSED: ${s.d}   TOTAL ACQUISITION COST: ${fmtMoney(tot.toFixed(2))}`);
  return L.join("\n");
}
function screensText(recs, sevenBit){
  const perf = "- ".repeat(40).trimEnd();
  const body = recs.map(recordScreen).join(sevenBit ? `\n\n${perf}\n\n` : "\n\n\n");
  return (sevenBit ? to7bit(body) : body) + "\n";
}
function cleanText(recs){
  const cols = [["LOG", r => r.log_no], ["MAKE", r => r.make], ["MODEL", r => r.model], ["CAL.", r => r.caliber], ["SERIAL", r => r.serial]];
  const w = cols.map(([h,f]) => Math.max(h.length, ...recs.map(r => String(f(r) || "").length)));
  const row = vals => vals.map((v,i) => pad(v || "", w[i])).join("  ").replace(/\s+$/,"");
  const W = Math.max(w.reduce((a,b) => a + b, 0) + 2 * (w.length - 1), 40);
  const L = [];
  L.push(center(spaced("QUICKFIRE"), W).trimEnd());
  L.push(center(`CLEAN LIST   ${recs.length} RECORD${recs.length===1?"":"S"}   PRINTED ${fmtDate(todayISO())}`, W).trimEnd());
  L.push("=".repeat(W));
  L.push(row(cols.map(c => c[0])));
  L.push("-".repeat(W));
  recs.forEach(r => L.push(row(cols.map(([,f]) => f(r)))));
  L.push("=".repeat(W));
  return L.join("\n");
}
function jsonText(recs){
  return JSON.stringify({ generator:`QUICKFIRE v${VERSION}`, exported: todayISO(), records: recs.map(r => {
    const o = {}; CSV_COLS.forEach(c => { o[c] = c === "repairs" ? r.repairs : c === "status" ? (isDisposed(r) ? "DISPOSED" : "HELD") : r[c]; });
    return o;
  }) }, null, 2);
}

/* ═══════════════════════════════════════════════════════════════════════
   TERMINAL
   ═══════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const out = $("out"), inp = $("in"), psEl = $("ps"), typedEl = $("typed");

function cls(){ out.innerHTML = ""; }
function ln(html){
  const d = document.createElement("div");
  d.className = "ln";
  d.innerHTML = html || "";
  out.appendChild(d);
  while(out.childElementCount > 1500) out.removeChild(out.firstChild);
  out.scrollTop = out.scrollHeight;
  return d;
}
function raw(text, cls){ String(text).split("\n").forEach(l => ln(cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l))); }
function say(text, cls){
  const m = /^ */.exec(text)[0].length, ind = " ".repeat(Math.max(1, m));
  wrap(String(text).slice(m), COLS - 1 - ind.length).forEach(l => ln(`<span class="${cls||""}">${esc(ind + l)}</span>`));
}
function blank(){ ln(""); }
function opt(cmd, key, label){ return `<a class="opt" role="button" tabindex="0" data-cmd="${esc(cmd)}">[${esc(key)}]</a> ${esc(label)}`; }
function opts(list, indent=" ", gap="  "){
  /* list of [cmd,key,label]; packs onto lines ≤ 80 cols */
  let line = indent, len = indent.length, html = indent;
  const lines = [];
  list.forEach(([c,k,l]) => {
    const w = k.length + 3 + l.length;
    if(len > indent.length && len + gap.length + w > COLS){ lines.push(html); html = indent; len = indent.length; }
    if(len > indent.length){ html += gap; len += gap.length; }
    html += opt(c,k,l); len += w;
  });
  lines.push(html);
  lines.forEach(h => ln(h));
}
function menuList(list){ list.forEach(([c,k,l]) => ln(" " + opt(c,k,l))); }
function err(msg){ ln(`<span class="inv">${esc(" " + msg + " ")}</span>`); beep(220, .12); }
function ok(msg){ say(msg); }

/* screen readers hear the last few lines and the prompt, not the whole scrollback */
function announce(){
  const lines = [...out.querySelectorAll(".ln")].slice(-4).map(d => d.textContent.trim()).filter(Boolean);
  $("sr").textContent = lines.join(". ") + ". " + psEl.textContent;
}
function ask(ps, handler, hint){
  psEl.textContent = ps + " ";
  setTimeout(announce, 0);
  S.handler = handler;
  if(hint !== undefined) S.hint = hint;
  renderStatus();
  renderTyped();
  focusIn();
}
function focusIn(){ if(document.activeElement !== inp) inp.focus({ preventScroll:true }); }

function renderTyped(){
  const v = inp.value, p = inp.selectionStart ?? v.length;
  const before = v.slice(0,p), at = v.slice(p,p+1), after = v.slice(p+1);
  typedEl.innerHTML = esc(before) + (at ? `<span class="cursor over">${esc(at)}</span>` : `<span class="cursor"></span>`) + esc(after);
}
function submit(text){
  const ps = psEl.textContent;
  ln(`<span class="dim">${esc(ps)}</span>${esc(text)}`);
  if(text.trim()){ S.history.push(text); if(S.history.length > 100) S.history.shift(); }
  S.hIdx = S.history.length;
  inp.value = ""; renderTyped();
  const h = S.handler;
  if(h) h(text);
}

/* status + top bars */
function renderTop(){
  const d = new Date();
  const ts = `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}-${d.getFullYear()}  ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  $("topbar").textContent = pad(" QUICKFIRE  v" + VERSION, COLS - ts.length - 1) + ts + " ";
}
function renderStatus(){
  const s = stats();
  const right = `RECS ${s.n}  HELD ${s.h} │ ${(S.fileName || "UNSAVED").toUpperCase()}${S.dirty ? " *" : ""}${autoOn() ? " AUTO" : ""} `;
  const left = " " + (S.hint || "F1 HELP  F2 SAVE  F3 NEW  ESC MENU");
  $("statusbar").textContent = pad(left.slice(0, COLS - right.length - 2), COLS - right.length) + right;
  if(S.ui === "q2" && typeof M !== "undefined") M.refreshFile();
}

/* PC speaker */
let actx = null;
function beep(freq=880, dur=.07){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.value = .035;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* fit 80 columns to the tube */
function fit(){
  const tube = $("tube");
  const w = tube.clientWidth;
  // first guess: 80 cols at 0.5625em, plus 1em padding per side and a thin scrollbar
  let fs = Math.max(10, Math.min(30, Math.floor((w - 14) / (COLS * 0.5625 + 2))));
  // glyph advances round to whole pixels, so measure and step down until 80 columns fit
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  probe.textContent = "═".repeat(COLS);
  out.appendChild(probe);
  const root = document.documentElement.style;
  root.setProperty("--fs", fs + "px");
  while(fs > 10 && probe.getBoundingClientRect().width > out.clientWidth - 2){ fs--; root.setProperty("--fs", fs + "px"); }
  probe.remove();
}

/* ═══════════════════════════════════════════════════════════════════════
   PERSISTENCE
   ═══════════════════════════════════════════════════════════════════════ */
function markDirty(){
  S.revision++;
  S.dirty = true;
  stash();
  renderStatus();
  if(autoOn()) autoWrite();
}
/* messages that can come from shared code land in whichever interface is showing */
function notify(msg, kind){
  if(S.ui === "q2") return M.toast(msg.charAt(0) + msg.slice(1).toLowerCase(), kind);
  if(kind === "error") err(msg); else say(msg);
}
function markLoaded(){ S.revision = 0; S.savedRevision = 0; S.dirty = false; }
const autoOn = () => !!(S.fileHandle && S.autosave);
/* every write to disk goes through one queue, so autosave and F2 can't overlap */
function queueWrite(fn){
  const p = S.writeChain.then(fn).then(() => true, e => { S.lastWriteError = e; return false; });
  S.writeChain = p;
  return p;
}
async function writeFile(h, csv){
  if(h.queryPermission && (await h.queryPermission({ mode:"readwrite" })) !== "granted"){
    if((await h.requestPermission({ mode:"readwrite" })) !== "granted") throw new Error("PERMISSION REFUSED");
  }
  const w = await h.createWritable();
  await w.write(csv); await w.close();
}
/* a write only marks the ledger clean up to the revision it actually contained */
function noteSaved(rev){
  S.savedRevision = Math.max(S.savedRevision, rev);
  S.dirty = S.savedRevision < S.revision;
  stash(); renderStatus();
}
function autoWrite(){
  const h = S.fileHandle, rev = S.revision, csv = toCSV(S.records);
  queueWrite(() => writeFile(h, csv)).then(ok => {
    if(h !== S.fileHandle) return;            // a different ledger was opened meanwhile
    if(ok) noteSaved(rev);
    else { S.dirty = true; renderStatus(); notify(`COULD NOT WRITE TO ${S.fileName.toUpperCase()}. SAVE BY HAND (F2 OR CTRL+S).`, "error"); }
  });
}
function recordedNote(prefix){
  return prefix + (autoOn() ? ` WRITING TO ${S.fileName.toUpperCase()}.` : " PRESS F2 TO SAVE THE LEDGER TO DISK.");
}
const RECOVERY_PREF = "quickfire:recovery-off";
function stash(){
  if(!S.recovery) return;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ v:1, savedAt: new Date().toISOString(), fileName: S.fileName, csv: toCSV(S.records), dirty: S.dirty }));
    S.stashOK = true;
  }catch(e){
    S.stashOK = false;
    if(!S.stashWarned){ S.stashWarned = true; notify("THIS BROWSER WON'T HOLD A RECOVERY COPY. SAVE OFTEN; UNSAVED CHANGES WILL BE LOST IF THE TAB CLOSES.", "error"); }
  }
}
function unstash(){
  try{
    const j = localStorage.getItem(STORE_KEY);
    if(!j) return null;
    const o = JSON.parse(j);
    if(!o || o.v !== 1 || typeof o.csv !== "string") return { unreadable:true };
    return o;
  }catch(e){ return { unreadable:true }; }
}
function dropStash(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function loadRecoveryPref(){
  try{
    S.recovery = localStorage.getItem(RECOVERY_PREF) !== "1";
    const probe = "quickfire:probe"; localStorage.setItem(probe, "1"); localStorage.removeItem(probe);
    S.stashOK = true;
  }catch(e){ S.stashOK = false; }
}
function setRecovery(on){
  S.recovery = on;
  try{ if(on) localStorage.removeItem(RECOVERY_PREF); else localStorage.setItem(RECOVERY_PREF, "1"); }catch(e){}
  if(on) stash(); else dropStash();
}

function download(name, text, type="text/plain"){
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* writes the ledger; returns what happened so each interface can word it its own way */
async function saveCore(saveAs){
  const suggested = (S.fileName || "quickfire-ledger.csv").toLowerCase();
  let failedName = "";
  if(window.showSaveFilePicker){
    let fh = S.fileHandle;
    try{
      if(!fh || saveAs) fh = await window.showSaveFilePicker({ suggestedName: suggested, types:[{ description:"CSV ledger", accept:{ "text/csv":[".csv"] } }] });
    }catch(e){
      if(e && e.name === "AbortError") return { status:"cancelled" };
      fh = null;
    }
    if(fh){
      const rev = S.revision, csv = toCSV(S.records);
      if(await queueWrite(() => writeFile(fh, csv))){
        S.fileHandle = fh; S.fileName = fh.name;
        noteSaved(rev);
        return { status:"saved", name:S.fileName };
      }
      failedName = fh.name;
    }
  }
  const rev = S.revision;
  download(suggested, toCSV(S.records), "text/csv");
  S.fileName = suggested;
  noteSaved(rev);
  return { status:"downloaded", name:suggested, failedName };
}
async function saveLogbook(saveAs, then){
  const r = await saveCore(saveAs);
  if(r.status === "cancelled") say(S.dirty ? "SAVE CANCELLED. THE INK IS STILL WET." : "SAVE CANCELLED.");
  else if(r.status === "saved"){ ok(`LEDGER WRITTEN TO ${r.name.toUpperCase()}  (${S.records.length} RECORD${S.records.length===1?"":"S"})`); beep(1320,.05); }
  else {
    if(r.failedName) err(`COULD NOT WRITE TO ${r.failedName.toUpperCase()}. DOWNLOADING A COPY INSTEAD.`);
    ok(`DOWNLOAD STARTED: ${r.name.toUpperCase()}. CHECK YOUR DOWNLOADS FOLDER. THIS BROWSER CAN'T WRITE IN PLACE, SO EACH SAVE IS A NEW COPY.`);
  }
  renderStatus(); if(then) then();
}

function confirmDiscard(action, proceed){
  const back = S.screen || goMenu;
  blank();
  say(`THE CURRENT LEDGER HAS UNSAVED CHANGES. ${action} WILL DISCARD THEM.`);
  opts([["Y","Y","DISCARD THEM"],["N","N","KEEP WORKING"]]);
  ask("DISCARD?", v => { if(/^Y/i.test(v.trim())) proceed(); else back(); }, "Y DISCARD  N CANCEL");
}
/* asks the browser for a ledger file: {text,name,handle}, null if cancelled, or "fallback" for the plain file input */
async function pickLedgerFile(){
  if(window.showOpenFilePicker){
    try{
      const [fh] = await window.showOpenFilePicker({ types:[{ description:"CSV ledger", accept:{ "text/csv":[".csv"] } }] });
      const f = await fh.getFile();
      return { text: await f.text(), name: f.name, handle: fh };
    }catch(e){
      if(e && e.name === "AbortError") return null;
    }
  }
  return "fallback";
}
async function openLogbook(allowDiscard){
  if(S.dirty && !allowDiscard) return confirmDiscard("OPENING ANOTHER LEDGER", () => openLogbook(true));
  const f = await pickLedgerFile();
  if(f === null) return say("NOTHING OPENED. THE CURRENT LEDGER IS UNCHANGED.");
  if(f === "fallback"){ $("filepick").click(); return say("CHOOSE A .CSV FILE IN THE DIALOG, OR DROP ONE ONTO THE SCREEN."); }
  loadText(f.text, f.name, f.handle);
}
/* the only place a ledger is replaced: validate first, touch S only on success */
function adoptLedger(text, name, handle){
  const res = parseLedger(text);
  if(res.errors.length) return res;
  S.records = res.records; S.fileName = name; S.fileHandle = handle || null;
  markLoaded(); stash();
  S.lastWarnings = res.warnings;
  return res;
}
function loadText(text, name, handle){
  const res = adoptLedger(text, name, handle);
  if(res.errors.length){
    err(`COULD NOT LOAD ${name.toUpperCase()}. NOTHING WAS CHANGED.`);
    res.errors.slice(0, 6).forEach(m => say("  " + m));
    if(res.errors.length > 6) say(`  ...AND ${res.errors.length - 6} MORE.`);
    return false;
  }
  goMenu(`OPENED ${name.toUpperCase()}: ${res.records.length} RECORD${res.records.length===1?"":"S"} READ.` +
    (handle ? "" : window.showSaveFilePicker ? " NOT BOUND: F2 WILL ASK WHERE TO WRITE." : " SAVES WILL DOWNLOAD A NEW COPY."));
  if(res.warnings.length){
    say(`${res.warnings.length} WARNING${res.warnings.length===1?"":"S"}:`, "dim");
    res.warnings.slice(0, 5).forEach(m => say("  " + m, "dim"));
    if(res.warnings.length > 5) say(`  ...AND ${res.warnings.length - 5} MORE. TYPE CHECK TO SEE THEM ALL.`, "dim");
  }
  beep(1320,.05);
  return true;
}

/* ═══════════════════════════════════════════════════════════════════════
   GLOBAL VERBS (work from menu, rack and record screens)
   ═══════════════════════════════════════════════════════════════════════ */
function findLog(token){
  const t = String(token).replace(/^#/,"").trim().toUpperCase();
  if(!t) return null;
  return S.records.find(r => String(r.log_no).toUpperCase() === t)
      || S.records.find(r => /^\d+$/.test(t) && parseInt(r.log_no,10) === parseInt(t,10));
}
function globalVerb(input){
  const v = input.trim(); const U = v.toUpperCase();
  const [verb, ...rest] = U.split(/\s+/); const arg = v.split(/\s+/).slice(1).join(" ");
  switch(verb){
    case "HELP": case "?": case "H": showHelp(); return true;
    case "MENU": case "M": case "VAULT": goMenu(); return true;
    case "LOOK": case "L": if(S.screen) S.screen(); return true;
    case "NEW": case "ADD": case "TAKE": case "GET": startWizard(blankRecord(), true); return true;
    case "BROWSE": case "LIST": case "RACK": case "INVENTORY": case "INV": case "I": browse({ page:0 }); return true;
    case "SEARCH": case "FIND":
      if(arg){ browse({ q: arg, page:0 }); } else askSearch(); return true;
    case "EXAMINE": case "X": case "READ": {
      const r = findLog(arg);
      if(!arg){ say("EXAMINE WHICH LOG NUMBER?"); return true; }
      if(r) viewRecord(r); else err(`NO LOG #${arg.toUpperCase()} IN THIS LEDGER.`);
      return true;
    }
    case "DROP": case "SELL": case "DISPOSE": {
      const r = findLog(arg);
      if(!arg){ say("DROP WHICH LOG NUMBER? (THIS RECORDS A DISPOSITION.)"); return true; }
      if(r) startWizard(r, false, { jump:"_possess", disposed:true }); else err(`NO LOG #${arg.toUpperCase()} IN THIS LEDGER.`);
      return true;
    }
    case "SAVE": saveLogbook(rest[0] === "AS"); return true;
    case "OPEN": case "LOAD": case "RESTORE": openLogbook(); return true;
    case "EXPORT": case "PRINT": case "OUTPUT": exportStart(null); return true;
    case "2000": case "MODERN": setUI("q2"); return true;
    case "QUICKFIRE": if(rest[0] === "2000"){ setUI("q2"); return true; } break;
    case "RECOVERY":
      setRecovery(!S.recovery);
      say(S.recovery ? (S.stashOK ? "RECOVERY COPY ON. A PLAINTEXT COPY OF THE LEDGER IS KEPT IN THIS BROWSER'S LOCAL STORAGE." : "RECOVERY COPY ON, BUT THIS BROWSER IS REFUSING TO STORE IT.")
                     : "RECOVERY COPY OFF AND ERASED. NOTHING IS KEPT IN THIS BROWSER; UNSAVED CHANGES ARE LOST IF THE TAB CLOSES.");
      return true;
    case "CHECK": {
      const w = S.lastWarnings || [];
      if(!w.length) say("NO WARNINGS FROM THE LAST FILE OPENED.");
      else { say(`${w.length} WARNING${w.length===1?"":"S"} FROM THE LAST FILE OPENED:`); w.forEach(m => say("  " + m, "dim")); }
      return true;
    }
    case "AUTOSAVE": case "AUTO":
      S.autosave = !S.autosave; renderStatus();
      if(!S.autosave) say("AUTOSAVE OFF. CHANGES STAY IN THE PROGRAM UNTIL YOU PRESS F2.");
      else if(S.fileHandle){ say(`AUTOSAVE ON. CHANGES ARE WRITTEN TO ${S.fileName.toUpperCase()} AS YOU MAKE THEM.`); if(S.dirty) autoWrite(); }
      else say(window.showSaveFilePicker ? "AUTOSAVE ON. IT STARTS ONCE THE LEDGER IS BOUND TO A FILE: PRESS F2 AND CHOOSE ONE." : "AUTOSAVE ON, BUT THIS BROWSER CAN'T WRITE TO FILES IN PLACE. USE CHROME OR EDGE, OR PRESS F2 TO DOWNLOAD A COPY.");
      return true;
    case "SOUND": S.sound = !S.sound; say("SPEAKER " + (S.sound ? "ON." : "OFF.")); beep(); return true;
    case "CLS": case "CLEAR": cls(); return true;
    case "XYZZY": case "PLUGH": say("NOTHING HAPPENS. THIS IS NOT THAT KIND OF CAVE."); return true;
    case "GO": case "NORTH": case "SOUTH": case "EAST": case "WEST": case "UP": case "DOWN": case "NE": case "NW": case "SE": case "SW":
      say("THE ONLY EXIT IS THE DOOR YOU CAME IN BY, AND IT IS ON A TIME LOCK."); return true;
    case "QUIT": case "EXIT": case "BYE":
      if(S.dirty) say("THE INK IS STILL WET. SAVE FIRST, OR THESE CHANGES LIVE ONLY IN THIS BROWSER'S WORKING COPY.");
      else { blank(); say("IT IS NOW SAFE TO TURN OFF YOUR COMPUTER."); }
      return true;
    case "ABOUT": case "VER": case "VERSION": showAbout(); return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════════════════
   MAIN MENU — THE VAULT
   ═══════════════════════════════════════════════════════════════════════ */
function goMenu(notice){
  S.screen = () => goMenu();
  W = null;
  cls();
  raw(bannerBox(spaced("QUICKFIRE")).join("\n"));
  raw(center("FIREARM INVENTORY RECORD SYSTEM", COLS), "dim");
  ln("");
  const s = stats();
  if(!s.n){
    say("YOU ARE IN THE VAULT. THE RACKS ARE BARE AND THE LEDGER ON THE STEEL BENCH IS BLANK. EITHER YOU ARE JUST GETTING STARTED, OR YOU ARE VERY DISCREET.");
  } else {
    const last = S.records.reduce((a,r) => (String(r.log_no).localeCompare(String(a.log_no), undefined, { numeric:true }) > 0 ? r : a), S.records[0]);
    say(`YOU ARE IN THE VAULT. THE LEDGER ON THE STEEL BENCH RECORDS ${s.n} FIREARM${s.n===1?"":"S"}: ${s.h} IN YOUR KEEPING, ${s.d} GONE TO OTHER HANDS. THE MOST RECENT ENTRY IS #${last.log_no}, ${articled([last.make, last.model].filter(Boolean).join(" ") || typeOf(last) || "UNDESCRIBED ITEM")}.`);
  }
  blank();
  const wet = S.dirty ? " THE INK ON THE LAST PAGE IS STILL WET. PRESS F2 TO SAVE." : "";
  if(S.fileHandle) say(`THE LEDGER IS BOUND TO ${S.fileName.toUpperCase()}.` + (autoOn() ? " CHANGES ARE WRITTEN TO IT AS YOU MAKE THEM." : wet));
  else if(S.fileName) say(`LAST OPENED OR SAVED AS ${S.fileName.toUpperCase()}, BUT NOT BOUND TO IT.` + (window.showSaveFilePicker ? " F2 WILL ASK WHERE TO WRITE." : " EACH SAVE DOWNLOADS A NEW COPY.") + wet);
  else if(s.n) say("THE LEDGER HAS NOT YET BEEN BOUND TO A FILE. SAVE IT BEFORE YOU WANDER OFF.");
  if(S.recovery && !S.stashOK) say("WARNING: THIS BROWSER WON'T HOLD A RECOVERY COPY. SAVE OFTEN.", "dim");
  MENU_ART.split("\n").forEach(l => { const d = ln(`<span class="art">${esc(l)}</span>`); d.style.textAlign = "center"; d.style.fontSize = ".9em"; });
  say("WHAT NOW?");
  menuList([
    ["1","1","LOG A NEW FIREARM"],
    ["2","2","BROWSE THE RACK"],
    ["3","3","SEARCH THE LEDGER"],
    ["4","4","OPEN A LEDGER FILE (.CSV)"],
    ["5","5","SAVE THE LEDGER"],
    ["6","6","EXPORT OR PRINT"],
    ["7","7","HELP"],
    ["8","8","START A FRESH LEDGER"],
  ]);
  if(notice){ blank(); say(notice); }
  blank();
  ask("VAULT>", menuInput, "");
}
function articled(s){ s = s.toUpperCase(); return (/^[AEIOU]/.test(s) ? "AN " : "A ") + s; }
function menuInput(v){
  const U = v.trim().toUpperCase();
  switch(U){
    case "X": return easterEgg();
    case "1": return startWizard(blankRecord(), true);
    case "2": return browse({ page:0, q:"" });
    case "3": return askSearch();
    case "4": return openLogbook();
    case "5": return saveLogbook(false);
    case "6": return exportStart(null);
    case "7": return showHelp();
    case "8": return freshLedger();
    case "": return goMenu();
  }
  if(!globalVerb(v)) { err("I DON'T KNOW HOW TO " + U.split(" ")[0] + ". TRY A NUMBER, OR HELP."); }
}
function freshLedger(){
  if(S.dirty || S.records.length){
    say(S.dirty ? "THE CURRENT LEDGER HAS UNSAVED CHANGES. A FRESH LEDGER DISCARDS THEM." : "CLOSE THIS LEDGER AND START A BLANK ONE? (THE FILE ON DISK IS UNTOUCHED.)");
    opts([["Y","Y","START FRESH"],["N","N","KEEP THIS ONE"]]);
    ask("FRESH?", v => {
      if(/^Y/i.test(v)){ S.records = []; S.fileName = ""; S.fileHandle = null; markLoaded(); dropStash(); goMenu("A CLEAN LEDGER. THE PAGES SMELL OF NOTHING YET."); }
      else goMenu();
    }, "Y START FRESH  N CANCEL");
  } else goMenu("THE LEDGER IS ALREADY BLANK.");
}

const WIZ_HINT = "ENTER KEEP  - CLEAR  BACK PREV  ABORT";
let W = null;

function startWizard(rec, isNew, o={}){
  W = { orig: isNew ? null : rec, rec: clone(rec), isNew, i:0, disposed: o.disposed ?? isDisposed(rec), rp:null, seen:new Set() };
  if(isNew){ W.rec.log_no = nextLogNo(); }
  if(o.jump){ W.i = STEPS.findIndex(s => s.key === o.jump); STEPS.slice(0, W.i).forEach(s => W.seen.add(s.sec)); }
  S.screen = () => { cls(); askStep(0); };
  cls();
  raw(rule(isNew ? "NEW ENTRY" : `AMEND LOG #${rec.log_no}`));
  say("ENTER KEEPS THE VALUE IN [BRACKETS]. TYPE - TO STRIKE IT OUT, BACK FOR THE PREVIOUS FIELD, ABORT TO WALK AWAY. CLICKING A [CHOICE] WORKS TOO.", "dim");
  askStep(1);
}
const visible = s => !s.when || s.when(W.rec, W);
function curDisplay(s){
  const v = W.rec[s.key];
  if(!v) return "";
  if(s.type === "date") return fmtDate(v);
  if(s.type === "money") return fmtMoney(v);
  if(s.key === "log_no" && W.isNew) return v + " (NEXT IN SEQUENCE)";
  return v;
}
function askStep(dir){
  if(dir === 0) dir = 1;
  while(W.i >= 0 && W.i < STEPS.length && !visible(STEPS[W.i])) W.i += dir;
  if(W.i < 0){ W.i = 0; return askStep(1); }
  if(W.i >= STEPS.length) return review();
  const s = STEPS[W.i];
  if(!W.seen.has(s.sec)){
    W.seen.add(s.sec);
    blank(); raw(rule(SECT[s.sec].title)); const f = SECT[s.sec].flavor(W); if(f) say(f);
  }
  if(s.kind === "repairs") return askRepairs();
  if(s.kind === "possess") return askPossess();
  blank();
  const c = curDisplay(s);
  const qt = typeof s.q === "function" ? s.q(W.rec) : s.q;
  ln(`<span class="q">${esc(" ► " + qt)}</span>${c ? `<span class="cur">${esc("  [" + c + "]")}</span>` : ""}`);
  if(s.hint) say("   " + s.hint, "dim");
  if(s.type === "date") say("   MM/DD/YYYY, OR TODAY", "dim");
  if(s.choices) opts(s.choices.map((ch,i) => [String(i+1), String(i+1), ch]), "   ");
  ask(s.ps + ">", fieldInput, WIZ_HINT);
}
function wizCommon(v){
  const U = v.trim().toUpperCase();
  if(U === "BACK" || U === "<"){ W.i--; askStep(-1); return true; }
  if(U === "ABORT" || U === "ESC"){ confirmAbort(); return true; }
  if(U === "HELP" || U === "?"){ say("ENTER KEEPS THE BRACKETED VALUE.  -  CLEARS IT.  BACK RETURNS TO THE PREVIOUS FIELD.  ABORT ABANDONS THE ENTRY WITHOUT CHANGING THE LEDGER.", "dim"); return true; }
  return false;
}
function matchChoice(v, choices){
  const U = v.trim().toUpperCase();
  const n = parseInt(U,10);
  if(/^\d+$/.test(U) && n >= 1 && n <= choices.length) return { ok:true, v: choices[n-1] };
  const hits = choices.filter(c => c.startsWith(U));
  if(hits.length === 1) return { ok:true, v: hits[0] };
  if(hits.length > 1) return { ok:false, msg:`"${U}" COULD BE ${hits.join(" OR ")}. BE MORE SPECIFIC.` };
  return { ok:false, msg:"PICK ONE OF THE NUMBERED CHOICES." };
}
function fieldInput(v){
  const s = STEPS[W.i];
  if(wizCommon(v)) return;
  const t = v.trim();
  if(t === ""){
    if(s.req && !W.rec[s.key]){ err("THE LEDGER NEEDS SOMETHING HERE."); return askStep(1); }
    W.i++; return askStep(1);
  }
  if(t === "-"){
    if(s.req){ err("THIS FIELD CAN'T BE BLANK."); return askStep(1); }
    W.rec[s.key] = ""; W.i++; return askStep(1);
  }
  let res = { ok:true, v:t };
  if(s.choices) res = matchChoice(t, s.choices);
  else if(s.type === "date") res = parseDate(t);
  else if(s.type === "money") res = parseMoney(t);
  if(!res.ok){ err(res.msg); return askStep(1); }
  W.rec[s.key] = res.v;
  if(s.choices && res.v !== "OTHER" && (s.key + "_other") in W.rec) W.rec[s.key + "_other"] = "";
  W.i++; askStep(1);
}

/* repairs sub-path */
function askRepairs(){
  const reps = W.rec.repairs;
  blank();
  if(reps.length){
    say(`${reps.length} ON FILE:`, "dim");
    reps.forEach((x,i) => say(`   ${i+1}. ${fmtDate(x.date) || "--/--/----"}  ${cut(x.desc, 50)}  ${fmtMoney(x.cost)}`, "dim"));
  }
  ln(`<span class="q">${esc(reps.length ? " ► ADD ANOTHER REPAIR OR MODIFICATION?" : " ► ANY REPAIRS OR MODIFICATIONS TO NOTE?")}</span>`);
  opts([["Y","Y","YES"],["N","N","NO, MOVE ON"]], "   ");
  ask("Y/N>", v => {
    if(wizCommon(v)) return;
    const U = v.trim().toUpperCase();
    if(U === "Y" || U === "YES"){ W.rp = { date:"", desc:"", cost:"" }; return repField("date"); }
    if(U === "" || U === "N" || U === "NO"){ W.i++; return askStep(1); }
    err("YES OR NO."); askRepairs();
  }, WIZ_HINT);
}
function repField(f){
  const Q = { date:["DATE OF WORK","DATE"], desc:["WHAT WAS DONE (AND BY WHOM)","WORK"], cost:["COST","COST"] }[f];
  blank();
  ln(`<span class="q">${esc("   ► " + Q[0])}</span>`);
  if(f === "date") say("     MM/DD/YYYY, OR TODAY. ENTER TO LEAVE UNDATED.", "dim");
  if(f === "cost") say("     ENTER TO LEAVE BLANK.", "dim");
  ask(Q[1] + ">", v => {
    const U = v.trim().toUpperCase(), t = v.trim();
    if(U === "ABORT"){ return confirmAbort(); }
    if(U === "BACK" || U === "<"){
      if(f === "date"){ W.rp = null; return askRepairs(); }
      return repField(f === "desc" ? "date" : "desc");
    }
    if(f === "date"){
      if(t){ const r = parseDate(t); if(!r.ok){ err(r.msg); return repField(f); } W.rp.date = r.v; }
      return repField("desc");
    }
    if(f === "desc"){
      if(!t){ err("DESCRIBE THE WORK, OR TYPE BACK."); return repField(f); }
      W.rp.desc = t; return repField("cost");
    }
    if(f === "cost"){
      if(t){ const r = parseMoney(t); if(!r.ok){ err(r.msg); return repField(f); } W.rp.cost = r.v; }
      W.rec.repairs.push(W.rp); W.rp = null;
      say("     NOTED.", "dim");
      return askRepairs();
    }
  }, WIZ_HINT);
}

/* possession fork */
function askPossess(){
  blank();
  ln(`<span class="q">${esc(" ► IS IT STILL IN YOUR POSSESSION?")}</span><span class="cur">${esc("  [" + (W.disposed ? "NO" : "YES") + "]")}</span>`);
  opts([["Y","Y","YES, IT STAYS"],["N","N","NO, IT HAS LEFT"]], "   ");
  ask("Y/N>", v => {
    if(wizCommon(v)) return;
    const U = v.trim().toUpperCase();
    if(U === "") { /* keep */ }
    else if(U === "Y" || U === "YES") W.disposed = false;
    else if(U === "N" || U === "NO") W.disposed = true;
    else { err("YES OR NO."); return askPossess(); }
    if(W.disposed) say("THEN THE LEDGER WANTS TO KNOW WHERE IT WENT.");
    W.i++; askStep(1);
  }, WIZ_HINT);
}

function review(){
  W.rec.status = W.disposed ? "DISPOSED" : "HELD";
  if(!isNFA(W.rec)) NFA_KEYS.forEach(k => W.rec[k] = "");
  if(W.rec.nfa_status === "PENDING"){ W.rec.nfa_approved = ""; W.rec.nfa_stamp = ""; }
  if(!hasOAL(W.rec)) W.rec.nfa_oal = "";
  if(!W.disposed) DISP_KEYS.forEach(k => W.rec[k] = "");
  blank();
  raw(recordScreen(W.rec));
  blank();
  const dupLog = S.records.find(r => r !== W.orig && String(r.log_no).toUpperCase() === String(W.rec.log_no).toUpperCase());
  const dupSer = W.rec.serial && S.records.filter(r => r !== W.orig && r.serial && r.serial.toUpperCase() === W.rec.serial.toUpperCase());
  if(dupLog) err(`LOG #${W.rec.log_no} IS ALREADY TAKEN. CHANGE THE LOG NUMBER BEFORE SAVING.`);
  if(dupSer && dupSer.length) say(`NOTE: SERIAL ${W.rec.serial} ALSO APPEARS ON LOG #${dupSer.map(r => r.log_no).join(", #")}.`, "dim");
  say(W.isNew ? "INK IT INTO THE LEDGER?" : "COMMIT THE AMENDMENT?");
  opts([["R","R","RECORD ENTRY"],["E","E","EDIT FROM THE TOP"],["A","A","ABANDON"]]);
  ask("CONFIRM>", v => {
    const U = v.trim().toUpperCase();
    if(U === "R" || U === "RECORD" || U === "S" || U === "Y"){
      if(dupLog){ W.i = 0; err("FIX THE LOG NUMBER FIRST."); return askStep(1); }
      return commit();
    }
    if(U === "E" || U === "EDIT"){ W.i = 0; W.seen = new Set(); cls(); return askStep(1); }
    if(U === "A" || U === "ABANDON" || U === "ABORT") return confirmAbort();
    if(U === "BACK" || U === "<"){ W.i = STEPS.length - 1; return askStep(-1); }
    err("R, E, OR A."); review();
  }, "R RECORD  E EDIT  A ABANDON  BACK");
}
function commit(){
  const r = W.rec, now = stamp();
  r.modified = now; if(!r.created) r.created = now;
  if(W.isNew) S.records.push(r);
  else { const i = S.records.indexOf(W.orig); if(i >= 0) S.records[i] = r; else S.records.push(r); }
  const wasNew = W.isNew;
  W = null;
  markDirty(); beep(1320,.05);
  viewRecord(r, recordedNote(wasNew ? "ENTRY RECORDED." : "AMENDMENT RECORDED."));
}
function confirmAbort(){
  say("ABANDON THIS ENTRY? NOTHING WILL CHANGE IN THE LEDGER.");
  opts([["Y","Y","ABANDON"],["N","N","KEEP GOING"]]);
  const back = W;
  ask("ABANDON?", v => {
    if(/^Y/i.test(v.trim())){ const orig = back.orig; W = null; if(orig) viewRecord(orig, "NOTHING CHANGED."); else goMenu("ENTRY ABANDONED. THE PAGE IS STILL BLANK."); }
    else { W = back; askStep(1); }
  }, "Y ABANDON  N CONTINUE");
}

/* ═══════════════════════════════════════════════════════════════════════
   THE RACK (browse / search)
   ═══════════════════════════════════════════════════════════════════════ */
const SORTS = ["LOG#","MAKE","TYPE","ACQUIRED","CALIBER"];
const FILTERS = ["ALL","HELD","DISPOSED","NFA"];
function rackList(){
  let list = S.records.slice();
  if(S.br.filter === "HELD") list = list.filter(r => !isDisposed(r));
  if(S.br.filter === "DISPOSED") list = list.filter(isDisposed);
  if(S.br.filter === "NFA") list = list.filter(isNFA);
  if(S.br.q){
    const q = S.br.q.toLowerCase();
    list = list.filter(r => CSV_COLS.some(c => c !== "repairs" && String(r[c]||"").toLowerCase().includes(q)) || r.repairs.some(x => [x.desc, x.date, fmtDate(x.date), x.cost].some(v => String(v||"").toLowerCase().includes(q))));
  }
  const cmp = (a,b) => String(a||"").localeCompare(String(b||""), undefined, { numeric:true, sensitivity:"base" });
  const key = { "LOG#": r => r.log_no || "\uffff", "MAKE": r => (r.make||"") + " " + (r.model||""), "TYPE": typeOf, "ACQUIRED": r => r.acq_date || "9999", "CALIBER": r => r.caliber }[S.br.sort];
  list.sort((a,b) => cmp(key(a), key(b)) || cmp(a.log_no, b.log_no));
  return list;
}
function pageSize(){
  const lh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 16;
  return Math.max(6, Math.floor(out.clientHeight / lh) - 14);
}
function browse(o){
  Object.assign(S.br, o || {});
  S.screen = () => browse();
  const list = rackList(), ps = pageSize();
  const pages = Math.max(1, Math.ceil(list.length / ps));
  S.br.page = Math.min(Math.max(0, S.br.page), pages - 1);
  S.rackList = list;
  cls();
  raw(rule("THE RACK"));
  const s = stats();
  if(!s.n){
    blank(); say("THE RACK IS EMPTY. NOTHING HAS BEEN LOGGED YET."); blank();
    opts([["1","N","LOG A NEW FIREARM"],["M","M","BACK TO THE VAULT"]]);
    return ask("RACK>", v => { const U = v.trim().toUpperCase(); if(U === "N" || U === "1") return startWizard(blankRecord(), true); if(U === "M" || U === "") return goMenu(); if(!globalVerb(v)) err("NOTHING HERE TO " + U + "."); }, "N NEW  M MENU");
  }
  say(`${list.length} OF ${s.n} SHOWN.  FILTER: ${S.br.filter}.  SORTED BY ${S.br.sort}.` + (S.br.q ? `  SEARCHING FOR "${S.br.q.toUpperCase()}".` : ""), "dim");
  blank();
  const hdr = " " + pad("LOG#",7) + pad("TYPE",9) + pad("MAKE",15) + pad("MODEL",15) + pad("CAL/GA",10) + pad("SERIAL",14) + "STATUS";
  ln(`<span class="dim">${esc(hdr)}</span>`);
  ln(`<span class="dim">${esc(" " + "─".repeat(78))}</span>`);
  const slice = list.slice(S.br.page * ps, S.br.page * ps + ps);
  if(!slice.length) say("NOTHING MATCHES. TRY C TO CLEAR THE SEARCH, OR F TO CHANGE THE FILTER.");
  slice.forEach(r => {
    const row = " " + pad(cut(r.log_no,6),7) + pad(cut(typeOf(r, true),8),9) + pad(cut(r.make,14),15) + pad(cut(r.model,14),15) + pad(cut(r.caliber,9),10) + pad(cut(r.serial,13),14) + (isDisposed(r) ? "GONE" : "HELD");
    ln(`<a class="row" role="button" tabindex="0" data-cmd="${r.log_no ? "#" + esc(r.log_no) : "@" + S.records.indexOf(r)}">${esc(row)}</a>`);
  });
  ln(`<span class="dim">${esc(" " + "─".repeat(78))}</span>`);
  say(`PAGE ${S.br.page+1} OF ${pages}. TYPE A LOG# (OR CLICK A ROW) TO EXAMINE IT. ANYTHING ELSE SEARCHES.`, "dim");
  blank();
  const nf = FILTERS[(FILTERS.indexOf(S.br.filter)+1) % FILTERS.length];
  const ns = SORTS[(SORTS.indexOf(S.br.sort)+1) % SORTS.length];
  const o2 = [];
  if(pages > 1){ o2.push(["N","N","NEXT"], ["P","P","PREV"]); }
  o2.push(["F","F","SHOW " + nf], ["S","S","SORT BY " + ns]);
  if(S.br.q) o2.push(["C","C","CLEAR SEARCH"]);
  o2.push(["A","A","ADD NEW"], ["M","M","VAULT"]);
  opts(o2);
  ask("RACK>", rackInput, "LOG# EXAMINE  N/P PAGE  F FILTER  S SORT  M MENU");
}
function rackInput(v){
  const t = v.trim(), U = t.toUpperCase();
  if(U === "") return browse();
  if(U === "N" || U === "NEXT"){ S.br.page++; return browse(); }
  if(U === "P" || U === "PREV"){ S.br.page--; return browse(); }
  if(U === "F"){ S.br.filter = FILTERS[(FILTERS.indexOf(S.br.filter)+1) % FILTERS.length]; S.br.page = 0; return browse(); }
  if(U === "S"){ S.br.sort = SORTS[(SORTS.indexOf(S.br.sort)+1) % SORTS.length]; return browse(); }
  if(U === "C"){ S.br.q = ""; S.br.page = 0; return browse(); }
  if(U === "A"){ return startWizard(blankRecord(), true); }
  if(U === "/"){ return askSearch(); }
  if(/^@\d+$/.test(t) && S.records[+t.slice(1)]) return viewRecord(S.records[+t.slice(1)]);
  const r = findLog(t);
  if(r) return viewRecord(r);
  if(globalVerb(v)) return;
  S.br.q = t; S.br.page = 0; browse();
}
function askSearch(){
  blank();
  say("SEARCH FOR WHAT? MAKE, SERIAL, A NAME, A CALIBER... ANY FRAGMENT WILL DO.");
  ask("FIND>", v => { const t = v.trim(); if(!t) return goMenu(); browse({ q:t, page:0 }); }, "ENTER A SEARCH TERM  (BLANK CANCELS)");
}

/* ═══════════════════════════════════════════════════════════════════════
   RECORD VIEW
   ═══════════════════════════════════════════════════════════════════════ */
function viewRecord(r, notice){
  S.cur = r;
  S.screen = () => viewRecord(r);
  cls();
  raw(recordScreen(r));
  if(r.created || r.modified) raw(` ENTERED ${fmtDate((r.created||"").slice(0,10)) || "?"}    LAST AMENDED ${fmtDate((r.modified||"").slice(0,10)) || "?"}`, "dim");
  blank();
  if(notice){ say(notice); blank(); }
  const list = (S.rackList && S.rackList.includes(r)) ? S.rackList : S.records;
  const i = list.indexOf(r);
  const o = [["E","E","AMEND"],["R","R","ADD REPAIR"]];
  if(r.repairs.length) o.push(["K","K","STRIKE REPAIR"]);
  o.push(isDisposed(r) ? ["U","U","UNDO DISPOSITION"] : ["D","D","DISPOSE"]);
  o.push(["O","O","EXPORT THIS"],["DEL","DEL","DELETE"]);
  if(i > 0) o.push(["P","P","PREV"]);
  if(i >= 0 && i < list.length - 1) o.push(["N","N","NEXT"]);
  o.push(["B","B","RACK"],["M","M","VAULT"]);
  opts(o);
  ask(r.log_no ? `#${r.log_no}>` : "UNNUMBERED>", v => recordInput(v, r, list, i), "E AMEND  R REPAIR  D DISPOSE  O EXPORT  B RACK");
}
function recordInput(v, r, list, i){
  const U = v.trim().toUpperCase();
  switch(U){
    case "": return viewRecord(r);
    case "E": case "EDIT": case "AMEND": return startWizard(r, false);
    case "R": case "REPAIR": return quickRepair(r);
    case "K": case "STRIKE": return strikeRepair(r);
    case "D": return startWizard(r, false, { jump:"_possess", disposed:true });
    case "U": return undoDisposition(r);
    case "O": return exportStart(r);
    case "DEL": case "DELETE": return deleteRecord(r);
    case "P": if(i > 0) return viewRecord(list[i-1]); return err("THIS IS THE FIRST PAGE.");
    case "N": if(i < list.length-1) return viewRecord(list[i+1]); return err("THIS IS THE LAST PAGE.");
    case "B": case "BACK": return browse();
  }
  if(!globalVerb(v)) err("NOT AN OPTION HERE. TRY ONE OF THE BRACKETED KEYS.");
}
function quickRepair(r){
  const rep = { date:"", desc:"", cost:"" };
  blank(); raw(rule("NEW REPAIR / MODIFICATION FOR #" + r.log_no, "─"));
  const step = f => {
    const P = { date:["DATE OF WORK (MM/DD/YYYY, TODAY, OR ENTER TO SKIP)","DATE"], desc:["WHAT WAS DONE (AND BY WHOM)","WORK"], cost:["COST (ENTER TO SKIP)","COST"] }[f];
    ln(`<span class="q">${esc(" ► " + P[0])}</span>`);
    ask(P[1] + ">", v => {
      const t = v.trim(), U = t.toUpperCase();
      if(U === "ABORT" || U === "ESC") return viewRecord(r, "NOTHING ADDED.");
      if(f === "date"){ if(t){ const p = parseDate(t); if(!p.ok){ err(p.msg); return step(f); } rep.date = p.v; } return step("desc"); }
      if(f === "desc"){ if(!t){ err("DESCRIBE THE WORK, OR TYPE ABORT."); return step(f); } rep.desc = t; return step("cost"); }
      if(t){ const p = parseMoney(t); if(!p.ok){ err(p.msg); return step(f); } rep.cost = p.v; }
      r.repairs.push(rep); r.modified = stamp();
      markDirty(); viewRecord(r, "REPAIR NOTED.");
    }, "ABORT CANCELS");
  };
  step("date");
}
function strikeRepair(r){
  if(!r.repairs.length) return err("NO REPAIRS TO STRIKE.");
  blank();
  r.repairs.forEach((x,i) => ln(" " + opt(String(i+1), String(i+1), `${fmtDate(x.date) || "--/--/----"}  ${cut(x.desc,48)}  ${fmtMoney(x.cost)}`)));
  say("STRIKE WHICH ONE? (ENTER CANCELS)");
  ask("STRIKE>", v => {
    const n = parseInt(v,10);
    if(!v.trim()) return viewRecord(r);
    if(!(n >= 1 && n <= r.repairs.length)){ err("NO SUCH LINE."); return strikeRepair(r); }
    r.repairs.splice(n-1,1); r.modified = stamp();
    markDirty(); viewRecord(r, `REPAIR LINE ${n} STRUCK.`);
  }, "NUMBER STRIKES  ENTER CANCELS");
}
function undoDisposition(r){
  say(`MARK #${r.log_no} AS BACK IN YOUR POSSESSION? THE DISPOSITION DETAILS WILL BE ERASED.`);
  opts([["Y","Y","YES, ERASE THEM"],["N","N","NO"]]);
  ask("UNDO?", v => {
    if(!/^Y/i.test(v.trim())) return viewRecord(r);
    DISP_KEYS.forEach(k => r[k] = "");
    r.modified = stamp();
    r.status = "HELD";
    markDirty(); viewRecord(r, "BACK ON THE RACK.");
  }, "Y ERASE  N CANCEL");
}
function deleteRecord(r){
  blank();
  say(`THIS REMOVES LOG #${r.log_no} FROM THE LEDGER ENTIRELY. IF IT WAS SOLD OR TRANSFERRED, DISPOSE IT INSTEAD; THAT KEEPS THE PAPER TRAIL.`);
  say("TYPE YES TO DELETE. ANYTHING ELSE CANCELS.");
  ask("DELETE?", v => {
    if(v.trim().toUpperCase() !== "YES") return viewRecord(r, "NOT DELETED.");
    S.records.splice(S.records.indexOf(r), 1);
    markDirty(); S.cur = null; browse({}); say(`LOG #${r.log_no} DELETED.`);
  }, "TYPE YES TO CONFIRM");
}

/* ═══════════════════════════════════════════════════════════════════════
   EXPORT
   ═══════════════════════════════════════════════════════════════════════ */
const FORMATS = [
  { id:"screens", label:"RECORD SCREENS  (ASCII, BOX-DRAWN .TXT)", ext:"txt" },
  { id:"dotmatrix", label:"DOT-MATRIX  (7-BIT .TXT, AS PRINTED IN 1990)", ext:"txt" },
  { id:"ledger", label:"LEDGER  (ONE LINE PER FIREARM, 132 COLUMNS)", ext:"txt" },
  { id:"clean", label:"CLEAN LIST  (LOG, MAKE, MODEL, CAL., SERIAL)", ext:"txt" },
  { id:"csv", label:"CSV  (SPREADSHEET)", ext:"csv" },
  { id:"json", label:"JSON", ext:"json" },
];
function exportStart(single){
  if(!S.records.length) { err("THE LEDGER IS EMPTY. THERE IS NOTHING TO EXPORT."); return; }
  const back = single ? () => viewRecord(single) : () => goMenu();
  S.screen = () => exportStart(single);
  cls();
  raw(rule("EXPORT / PRINT"));
  blank();
  if(single){ return exportFormat([single], `log-${String(single.log_no).replace(/[^\w-]/g,"")}`, back); }
  const s = stats();
  say("WHICH PAGES?");
  blank();
  const scopes = [["1","1",`THE WHOLE LEDGER (${s.n})`],["2","2",`ONLY WHAT YOU STILL HOLD (${s.h})`],["3","3",`ONLY WHAT HAS LEFT (${s.d})`]];
  if(S.br.q || S.br.filter !== "ALL") scopes.push(["4","4",`THE CURRENT RACK VIEW (${rackList().length})`]);
  menuList(scopes);
  blank();
  ask("PAGES>", v => {
    const U = v.trim().toUpperCase();
    if(U === "" || U === "M" || U === "ESC") return back();
    const sorted = S.records.slice().sort((a,b) => String(a.log_no || "\uffff").localeCompare(String(b.log_no || "\uffff"), undefined, { numeric:true }));
    const pick = { "1":[sorted,"all"], "2":[sorted.filter(r => !isDisposed(r)),"held"], "3":[sorted.filter(isDisposed),"disposed"], "4":[rackList(),"selection"] }[U];
    if(!pick || (U === "4" && scopes.length < 4)) return err("PICK 1, 2" + (scopes.length > 3 ? ", 3 OR 4." : " OR 3."));
    if(!pick[0].length) return err("NOTHING IN THAT SELECTION.");
    exportFormat(pick[0], pick[1], back);
  }, "NUMBER CHOOSES  ENTER CANCELS");
}
function exportFormat(recs, tag, back){
  blank();
  say(`${recs.length} RECORD${recs.length===1?"":"S"}. IN WHAT FORM?`);
  blank();
  menuList(FORMATS.map((f,i) => [String(i+1), String(i+1), f.label]));
  blank();
  ask("FORMAT>", v => {
    const U = v.trim();
    if(!U) return back();
    const f = FORMATS[parseInt(U,10) - 1];
    if(!f) return err("PICK A NUMBER FROM THE LIST.");
    exportDest(recs, tag, f, back);
  }, "NUMBER CHOOSES  ENTER CANCELS");
}
function renderExport(recs, f){
  switch(f.id){
    case "screens": return screensText(recs, false);
    case "dotmatrix": return screensText(recs, true);
    case "ledger": return ledgerText(recs) + "\n";
    case "clean": return cleanText(recs) + "\n";
    case "csv": return toCSV(recs);
    case "json": return jsonText(recs) + "\n";
  }
}
function exportDest(recs, tag, f, back){
  blank();
  say("WHERE TO?");
  blank();
  menuList([["1","1","DISK (DOWNLOAD A FILE)"],["2","2","PRINTER"],["3","3","SCREEN"]]);
  blank();
  ask("DEST>", v => {
    const U = v.trim();
    if(!U) return back();
    const text = renderExport(recs, f);
    const name = `quickfire_${tag}_${f.id}_${todayISO()}.${f.ext}`;
    if(U === "1"){
      download(name, text, f.ext === "csv" ? "text/csv" : f.ext === "json" ? "application/json" : "text/plain");
      say(`WROTE ${name.toUpperCase()}`); beep(1320,.05);
      blank(); opts([["","ENTER","CONTINUE"]]);
      return ask("OK>", () => back(), "ENTER CONTINUES");
    }
    if(U === "2"){
      const p = $("printout");
      p.textContent = text.replace(/^\uFEFF/,"");
      p.classList.toggle("wide", f.id === "ledger" || f.id === "csv" || f.id === "json");
      say(f.id === "ledger" ? "SENDING TO PRINTER. LANDSCAPE ORIENTATION RECOMMENDED FOR 132 COLUMNS." : "SENDING TO PRINTER.");
      setTimeout(() => window.print(), 50);
      blank(); opts([["","ENTER","CONTINUE"]]);
      return ask("OK>", () => back(), "ENTER CONTINUES");
    }
    if(U === "3"){
      cls();
      raw(text.replace(/^\uFEFF/,"").replace(/\n$/,""));
      blank();
      if(f.id === "ledger") say("132 COLUMNS: SCROLL SIDEWAYS, OR SEND IT TO THE PRINTER IN LANDSCAPE.", "dim");
      opts([["","ENTER","CONTINUE"]]);
      out.scrollTop = 0;
      return ask("OK>", () => back(), "ENTER CONTINUES");
    }
    err("1, 2, OR 3.");
  }, "1 DISK  2 PRINTER  3 SCREEN");
}

/* ═══════════════════════════════════════════════════════════════════════
   QUICKFIRE 2000 — the same ledger as a plain web application.
   Shares every data, file and export function with the terminal;
   only the presentation differs.
   ═══════════════════════════════════════════════════════════════════════ */
const UI_PREF = "quickfire:ui";
const M = {
  root: null, sel: null, editing: null, q: "", filter: "ALL", sort: { key:"log_no", dir:1 },
  restore: null, warnings: null, view: "list",
